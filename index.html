<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lands Between Journey</title>
<style>
  :root{
    --bg:#0b0907; --panel:#15110c; --line:#2e2618; --text:#eadfc4; --muted:#8f8368; --gold:#d9b25a;
    --boss:#c9503c; --quest:#d9b25a; --item:#6aa6d6; --ok:#79b568;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden}
  button{background:none;color:var(--text);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}

  /* top bar */
  #top{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  #top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
  #prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  #prog .bar{flex:1;max-width:340px;height:6px;background:#000;border-radius:4px;overflow:hidden}
  #prog .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  #otext{color:var(--muted);font-size:13px;white-space:nowrap}
  #search{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font:inherit;width:200px}
  #menu{display:flex;gap:6px}

  /* map */
  #main{flex:1;position:relative;min-height:0}
  #vp{position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;cursor:grab}
  #vp.drag{cursor:grabbing}
  #vp.placing{cursor:crosshair}
  #world{position:absolute;left:0;top:0;width:1920px;height:1827px;transform-origin:0 0;overflow:hidden}
  #world.anim{transition:transform .5s ease}
  #world img{position:absolute;left:0;top:0;width:1920px;height:1827px;display:block;user-select:none;-webkit-user-drag:none}
  #mapimg{filter:grayscale(1) brightness(1.02) contrast(1.05)}
  #mapcolor{filter:saturate(1.15) brightness(.95);clip-path:polygon(0 0,0 0,0 0);pointer-events:none}
  #zsvg{position:absolute;left:0;top:0;width:1920px;height:1827px}
  .z{fill:transparent;stroke:#000;stroke-opacity:.35;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
  .z:hover{fill:#ffffff22;stroke-opacity:.7}
  .z.sel{stroke-opacity:1;stroke-width:3.5;fill:transparent}
  #shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,#0008 100%);pointer-events:none}

  .bd{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));cursor:pointer;user-select:none;touch-action:none;pointer-events:none}
  .bd .pill{display:flex;align-items:center;gap:6px;background:#0f0c08e8;border:1.5px solid var(--hue,var(--gold));border-radius:999px;padding:2px 10px 2px 3px;pointer-events:auto;white-space:nowrap;box-shadow:0 2px 8px #000c}
  .bd .ring{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
      background:conic-gradient(var(--hue,var(--gold)) calc(var(--p)*1%), #ffffff2a 0)}
  .bd .ring b{width:20px;height:20px;border-radius:50%;background:#0f0c08;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .bd .nm{font-size:11.5px;font-weight:700;color:#fff}
  .bd .lv{font-size:10.5px;font-weight:700;color:var(--hue,var(--gold))}
  .bd:hover .pill{background:#241c10}
  .moving .bd{pointer-events:auto}
  .bd.full .ring{background:var(--ok)}
  .bd.full .ring b{color:var(--ok)}
  .bd.dim{opacity:.3}
  .bd.sel .ring{box-shadow:0 0 0 3px #fff,0 2px 8px #000c}
  .moving .bd{outline:1px dashed var(--gold);outline-offset:4px;cursor:move}

  .dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;
      border:2px solid #fff;transform:scale(var(--inv,1));cursor:pointer;box-shadow:0 1px 4px #000}
  .dot.boss{background:var(--boss)} .dot.quest{background:#a8802f} .dot.item{background:#3f77ab}
  .dot.found{background:#3f6a35;opacity:.6}
  .dot.sel{box-shadow:0 0 0 3px var(--gold)}
  .dot{width:14px;height:14px;margin:-7px 0 0 -7px;font-size:8px;border-width:1.5px}
  .dot.big{width:20px;height:20px;margin:-10px 0 0 -10px;font-size:11px;border-width:2px}
  .dot.approx{border-style:dashed}
  .dot.hl{z-index:6;transform:scale(calc(var(--inv,1)*1.9));border:2px solid #fff;animation:pulse 1.3s ease-out infinite}
  .has-hl .dot:not(.hl){opacity:.3}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #d9b25aff,0 0 0 3px #fff}100%{box-shadow:0 0 0 22px #d9b25a00,0 0 0 3px #fff}}
  .it.hl{background:#2a2112;box-shadow:inset 3px 0 0 var(--gold)}

  .zoom{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoom button{width:34px;height:34px;padding:0;font-size:18px;background:#15110ccc}
  #banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;background:var(--gold);color:#1b1408;padding:7px 16px;border-radius:999px;display:none;font-weight:600;max-width:90%;text-align:center}
  #nomap{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--muted);z-index:4;background:var(--bg)}

  /* journey strip */
  #journey{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:linear-gradient(transparent,#0b0907f0 40%)}
  .jc{flex:none;border:1px solid var(--line);border-radius:10px;padding:6px 11px;background:#15110cee;cursor:pointer;min-width:118px}
  .jc:hover{border-color:var(--gold)}
  .jc.sel{border-color:var(--gold)}
  .jc small{display:block;color:var(--muted);font-size:11.5px}
  .jc .jb{height:3px;background:#000;border-radius:2px;margin-top:5px;overflow:hidden}
  .jc .jb i{display:block;height:100%;background:var(--gold)}
  .jc.full .jb i{background:var(--ok)}

  /* detail */
  #detail{position:absolute;right:0;top:0;bottom:0;width:var(--dw,390px);max-width:100%;z-index:7;background:var(--panel);border-left:1px solid var(--line);
      transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
  #detail.open{transform:none}
  #dgrip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:9;touch-action:none}
  #dgrip:hover,#dgrip.on{background:linear-gradient(90deg,transparent 3px,var(--gold,#c9a85c) 3px,var(--gold,#c9a85c) 5px,transparent 5px)}
  #dh{padding:16px 18px 10px;border-bottom:1px solid var(--line);position:relative}
  #dh h2{margin:0;font-size:20px;color:var(--gold);font-weight:600;padding-right:26px}
  #dh .sub{color:var(--muted);font-size:13px}
  #dh .bar{height:5px;background:#000;border-radius:3px;overflow:hidden;margin:10px 0 8px}
  #dh .bar i{display:block;height:100%;background:var(--gold)}
  #dx{position:absolute;right:12px;top:12px;border:0;font-size:20px;padding:0 6px;line-height:1}
  #fl{display:flex;gap:6px;flex-wrap:wrap}
  #tabs{display:flex;gap:6px;margin:10px 0 8px}
  #tabs button.on{border-color:var(--gold);color:var(--gold)}
  .gh{padding:12px 18px 4px;color:var(--gold);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
  .gstep{display:flex;gap:10px;align-items:flex-start;padding:8px 18px;border-bottom:1px solid #211a10;border-left:3px solid transparent}
  .gstep input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
  .gstep .gt{flex:1;cursor:default}
  .gw{display:block;margin-top:5px;font-size:13px;line-height:1.5;color:#b8ab8c}
  .gw b{color:var(--gold);font-weight:600}
  .gstep.linked .gt{cursor:pointer}
  .gstep.done{background:#142014;border-left-color:var(--ok)}
  .gstep.done .gt{color:#9fcf92}
  .gstep.hl{background:#2a2112;border-left-color:var(--gold)}
  .it.done{background:#142014;box-shadow:inset 3px 0 0 var(--ok)}
  #rn{margin-top:10px;font-size:12.5px;color:#cfc3a4}
  #rn summary{cursor:pointer;color:var(--gold);list-style:none}
  #rn div{margin-top:6px;line-height:1.45}
  #di{overflow:auto;flex:1;padding:6px 0 90px}
  .warn{margin:10px 18px 0;padding:8px 11px;border:1px solid var(--boss);border-radius:8px;color:#f0c8bf;background:#2a1511;font-size:12.5px}
  .it{padding:9px 18px;border-bottom:1px solid #211a10}
  .ih{display:flex;gap:10px;align-items:flex-start}
  .ih input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
  .ih .t{flex:1;cursor:pointer}
  .it.done .t{color:var(--muted);text-decoration:line-through}
  .gl{display:inline-block;width:17px;text-align:center}
  .gl.boss{color:var(--boss)} .gl.quest{color:var(--quest)} .gl.item{color:var(--item)}
  .ib{margin:6px 0 2px 26px;font-size:13px;color:#cfc3a4}
  .ib b{color:var(--gold)}
  .ib em,.ib .note{color:var(--muted);font-size:12.5px}
  .ib .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .ib .act button,.ib .act a{font-size:12px;padding:3px 10px}
  .ib a{color:var(--item);border:1px solid var(--line);border-radius:999px;text-decoration:none}
  .pinned{color:var(--ok);font-size:11px}

  @media(max-width:1000px){
    #top{flex-wrap:wrap;gap:8px 12px}
    #menu{margin-left:auto}
    #prog{order:5;flex:1 1 100%}
    #prog .bar{max-width:none}
    #search{order:4;flex:1;width:auto;min-width:120px}
  }
  @media(max-width:800px){
    #top{padding:8px 12px}
    #dgrip{display:none}
    #detail{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
    #detail.open{transform:none}
    #journey{padding-bottom:6px}
  }
</style>
</head>

  <div id="prog"><div class="bar"><i id="obar"></i></div><span id="otext"></span></div>
  <input id="search" type="search" placeholder="Search...">
  <div id="menu">
    <button id="mv" title="Drag region badges to the right spot on the map">Move badges</button>
    <button id="exp">Export</button><button id="imp">Import</button><button id="reset">Reset</button>
  </div>
</header>

<section id="main">

  <div class="zoom"><button id="zin">+</button><button id="zout">&minus;</button><button id="zfit" style="font-size:12px">fit</button></div>

  <aside id="detail"><div id="dgrip" title="Drag to resize"></div>
    <div id="dh"><button id="dx" aria-label="Close">&times;</button><h2 id="dt"></h2><div class="sub" id="ds"></div><div class="bar"><i id="db"></i></div><div id="tabs"><button data-t="list">Checklist</button><button data-t="guide">Written guide</button></div><div id="fl"></div><details id="rn"><summary>Route notes</summary><div></div></details></div>

  </aside>
</section>

 "Goldmask + Brother Corhyn questline":"Riddle: west of Erdtree Sanctuary grace, down elevator and stairs. Stand on message facing the statue, cast Law of Regression (Golden Order Principia, after Godfrey golden shade; needs 37 Int). Solve BEFORE burning the Erdtree.",

 "Grab Capital loot before ashening: Bolt of Gransax, Golden Order Principia, Erdtree Bow, Celestial Dew":"Bolt of Gransax: giant spear lodged in a building in Leyndell, Royal Capital, reachable from the Erdtree Sanctuary grace after Godfrey (golden shade). Lost once Maliketh dies. Principia is above Erdtree Sanctuary; other spots not wiki-checked.",

 "Varre / Pureblood Knight's Medal":"White Mask Varre gives the Medal after three invasions in his questline; teleports you outside Mohgwyn Palace near Dynasty Mausoleum Entrance grace. The area is dangerous: don't use the Medal early. Varre can invade in the caves.",

const LABEL = {mountaintops:pc(1540,740), snowfield:pc(1250,480), leyndell:pc(870,560), ashen:pc(990,880), limgrave:pc(850,1470), weeping:pc(800,1730), caelid:pc(1200,1430), dragonbarrow:pc(1300,1220), stormveil:pc(560,1330), altus:pc(740,600), gelmir:pc(480,600), liurnia:pc(430,960), farum:pc(1445,410), haligtree:pc(1195,95)};
const bposOf = r => bpos[r.id] || LABEL[r.id] || (ZONES[r.id] ? centroid(ZONES[r.id]) : PIN0[r.id]);

let selItem = null, selR = null, filterT = "all", search = "", moving = false, placing = null;
const openIt = new Set();

function whereParts(it){ const raw=W[it.x]; if(!raw) return {txt:"",unv:false}; const p=raw.split("|"); return {txt:p[0],unv:p[1]==="u"}; }
function match(o){
  if (!search) return true;
  const hay=(o.it.x+" "+(o.it.n||"")+" "+whereParts(o.it).txt+" "+o.r.name).toLowerCase();
  return hay.includes(search);
}
function counts(list){ const d=list.filter(o=>done[o.id]).length; return {d,t:list.length}; }
const regionItems = r => ALL.filter(o=>o.r===r);

// ---------- pan / zoom ----------
const vp=$("vp"), world=$("world");
let S=1, TX=0, TY=0, fitS=1;
function apply(anim){
  world.classList.toggle("anim",!!anim);
  world.style.transform=`translate(${TX}px,${TY}px) scale(${S})`;
  world.style.setProperty("--inv",(1/Math.max(S,.0001)).toFixed(4));
  drawDots();
}
function fit(anim){
  const w=vp.clientWidth, h=vp.clientHeight;
  fitS=Math.min(w/MAPW,h/MAPH); S=fitS; TX=(w-MAPW*S)/2; TY=(h-MAPH*S)/2; apply(anim);
}
function zoomAt(cx,cy,f,anim){
  const s2=Math.max(fitS*.9,Math.min(5,S*f));
  TX=cx-(cx-TX)*s2/S; TY=cy-(cy-TY)*s2/S; S=s2; apply(anim);
}
const isMobile = ()=>window.matchMedia("(max-width:800px)").matches;
function centerOn(px,py,scale){
  const w=vp.clientWidth, h=vp.clientHeight;
  let cx=w/2, cy=h/2;
  if ($("detail").classList.contains("open")){
    if (isMobile()){ cy=h*0.19; } else { cx=(w-Math.min(390,w))/2; }
  }
  S=Math.min(5,scale);
  TX=cx-(px/100*MAPW)*S; TY=cy-(py/100*IMGH)*S; apply(true);
}
vp.addEventListener("wheel",e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015)); },{passive:false});
$("zin").onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.4,true);
$("zout").onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.4,true);
$("zfit").onclick=()=>fit(true);
window.addEventListener("resize",()=>{ const was=S<=fitS*1.001; fitS=Math.min(vp.clientWidth/MAPW,vp.clientHeight/MAPH); if(was) fit(); });

const ptrs=new Map(); let lastDist=0, moved=0, dragBd=null;
vp.addEventListener("pointerdown",e=>{
  moved=0;
  const bd=e.target.closest(".bd");
  if (bd && moving){ dragBd=bd; bd.setPointerCapture(e.pointerId); e.preventDefault(); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y); }
});
vp.addEventListener("pointermove",e=>{
  if (dragBd){
    const r=vp.getBoundingClientRect();
    const x=Math.max(0,Math.min(100,((e.clientX-r.left-TX)/S)/MAPW*100)), y=Math.max(0,Math.min(100,((e.clientY-r.top-TY)/S)/IMGH*100));
    bpos[dragBd.dataset.id]=[+x.toFixed(2),+y.toFixed(2)];
    dragBd.style.left=(x/100*MAPW)+"px"; dragBd.style.top=(y/100*IMGH)+"px"; moved=99; return;
  }
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if (ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if (moved>4){ if(!vp.classList.contains("drag")) try{vp.setPointerCapture(e.pointerId);}catch(_){} vp.classList.add("drag"); TX+=dx; TY+=dy; apply(); }
  } else if (ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), r=vp.getBoundingClientRect();
    if(lastDist) zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/lastDist);
    lastDist=d; moved=99;
  }
});
function endPtr(e){ if(dragBd){dragBd=null;saveB();return;} ptrs.delete(e.pointerId); lastDist=0; vp.classList.remove("drag"); }
vp.addEventListener("pointerup",endPtr); vp.addEventListener("pointercancel",endPtr);

// placing a pin
vp.addEventListener("click",e=>{
  if (!placing || moved>4) return;
  const r=vp.getBoundingClientRect();
  const x=((e.clientX-r.left-TX)/S)/MAPW*100, y=((e.clientY-r.top-TY)/S)/IMGH*100;
  ipos[placing]=[+x.toFixed(2),+y.toFixed(2)]; saveI(); stopPlacing(); drawDetail(); drawDots();
});
function startPlacing(id){
  placing=id; vp.classList.add("placing");
  $("banner").style.display="block"; $("banner").textContent="Click the map to pin: "+byId[id].it.x+"  (Esc to cancel)";
}
function stopPlacing(){ placing=null; vp.classList.remove("placing"); $("banner").style.display="none"; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(placing) stopPlacing(); else closeDetail(); } });

function drawBadges(){
  const L=$("bds"); L.innerHTML="";
  R.forEach(r=>{
    const p=bposOf(r); if(!p) return;
    const c=counts(regionItems(r)), pct=c.t?Math.round(c.d/c.t*100):0;
    const el=document.createElement("div");
    el.className="bd"+(pct===100?" full":"")+(selR===r?" sel":"")+(search&&!regionItems(r).some(match)?" dim":"");
    el.dataset.id=r.id; el.style.setProperty("--p",pct); el.style.setProperty("--hue",hueOf(r));
    el.style.left=(p[0]/100*MAPW)+"px"; el.style.top=(p[1]/100*IMGH)+"px";
    el.innerHTML=`<div class="pill"><div class="ring"><b>${pct===100?"✓":r.n}</b></div><span class="nm">${UNDER.has(r.id)?"↓ ":""}${esc(SHORT[r.id]||r.name)}</span><span class="lv">Lv ${esc(r.lvl)}</span></div>`;
    el.onclick=()=>{ if(placing||moved>4) return; select(r); };
    L.appendChild(el);
  });
}
// zone outlines (clickable) + color reveal of the selected zone
function drawZones(){
  const svg=$("zsvg"); svg.innerHTML="";
  const NSV="http://www.w3.org/2000/svg";
  R.forEach(r=>{
    const pts=ZONES[r.id]; if(!pts) return;
    const poly=document.createElementNS(NSV,"polygon");
    poly.setAttribute("points",pts.map(p=>p.join(",")).join(" "));
    poly.setAttribute("class","z"+(selR===r?" sel":""));
    if (selR===r){ poly.style.stroke=hueOf(r); poly.style.fill=hueOf(r)+"14"; }
    poly.addEventListener("click",()=>{ if(placing){ return; } if(moved>4) return; select(r); });
    svg.appendChild(poly);
  });
  const col=$("mapcolor");
  const pts = selR && ZONES[selR.id];
  col.style.clipPath = pts ? "polygon("+pts.map(p=>p[0]+"px "+p[1]+"px").join(",")+")" : "polygon(0 0,0 0,0 0)";
}

function dotPos(o){
  if (ipos[o.id]) return {pts:[ipos[o.id]], kind:"set"};
  const l = LOC[o.it.x];
  return l && l.length ? {pts:l, kind:"data"} : null;
}
function ptsBox(pts){
  const xs=pts.map(p=>p[0]/100*MAPW), ys=pts.map(p=>p[1]/100*IMGH);
  return {x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)};
}
function focusPts(pts){
  const bx=ptsBox(pts), w=vp.clientWidth, h=vp.clientHeight;
  let cx=w/2, cy=h/2;
  if ($("detail").classList.contains("open")){ if(isMobile()){ cy=h*0.19; } else { cx=(w-Math.min(390,w))/2; } }
  const bw=Math.max(bx.x1-bx.x0,80), bh=Math.max(bx.y1-bx.y0,80);
  const kx=(cx*1.6)/bw, ky=(cy*1.6)/bh;
  S=Math.max(fitS*1.3, Math.min(5, fitS*2.6, kx, ky));
  TX=cx-((bx.x0+bx.x1)/2)*S; TY=cy-((bx.y0+bx.y1)/2)*S; apply(true);
}
function drawDots(){
  const L=$("dots"); L.innerHTML="";
  L.classList.toggle("has-hl", !!selItem);
  ALL.forEach(o=>{
    if (selR!==o.r) return;                                // pins only for the selected zone
    const dp=dotPos(o); if(!dp) return;
    if (filterT!=="all" && o.it.t!==filterT) return;
    if (!match(o)) return;
    dp.pts.forEach(p=>{
      const el=document.createElement("div");
      el.className="dot big "+o.it.t+(done[o.id]?" found":"")+(selItem===o.id?" hl":"");
      el.textContent=done[o.id]?"\u2713":GL[o.it.t];
      el.style.left=(p[0]/100*MAPW)+"px"; el.style.top=(p[1]/100*IMGH)+"px";
      el.title=o.it.x;
      el.onclick=ev=>{ if(placing||moved>4) return; ev.stopPropagation(); selItem=o.id; openIt.add(o.id); drawDetail(); drawDots(); const row=document.querySelector(`[data-it="${CSS.escape(o.id)}"]`); if(row) row.scrollIntoView({block:"center"}); };
      L.appendChild(el);
    });
  });
}

const GUIDE = {"limgrave": ["# West Limgrave · Lv 1-15 (weapon +0/+1)", ["Buy basics at Church of Elleh (Kalé): Crafting Kit, Torch, Telescope. The upgrade bench is next to it.", null], ["Gatefront Ruins: pick up the West Limgrave map piece and the Whetstone Knife. An underground chest nearby holds Storm Stomp.", null], ["Talk to Melina at Gatefront and accept Torrent (needs 3 graces visited, or just rest at Gatefront).", "Meet Melina at Gatefront -> get Torrent", "Melina is the NPC who follows you all game. You cannot level up at a grace until you accept her as your maiden, so this is the real start of the game. She later gives you the Rold Medallion after Morgott and is the one who asks at the Forge of the Giants whether you will commit to burning the Erdtree. Torrent is the gift she gives for accepting."], ["Teleport to Church of Elleh at night: Renna gives the Spirit Calling Bell and Lone Wolf Ashes.", "Church of Elleh: Spirit Calling Bell (Renna)", "Renna appears here at night once you have Torrent. She is actually Ranni in disguise, and this meeting starts Ranni's questline, the longest in the game and the one that opens the Age of the Stars ending. She hands you the Spirit Calling Bell and Lone Wolf Ashes, your first spirit summon, which makes Margit and Godrick much easier. If you miss her, the Twin Maiden Husks at Roundtable Hold sell both."], ["Hit the tree disguise to find Boc the Seamster. Do his Coastal Cave errand, then bring back the Sewing Needle and Tailoring Tools.", "Boc the Seamster", "Boc is a tiny seamster who was cursed into a tree. Freeing him starts a quest that follows you across the world: he turns up again in Altus and in Leyndell, and the Larval Tear choice you make with him in Leyndell decides where he ends up. Missing him early is not fatal, but the quest rewards come from meeting him in order."], ["Night's Cavalry on the bridge at night drops Repeating Thrust. Optional, fine to skip.", null, "Night's Cavalry only spawns on the roads at night and is an optional early fight against a mounted enemy. It is mostly a loot and rune opportunity; if it is giving you trouble, rest until day and come back later."], ["Sorceress Sellen waits in Waypoint Ruins, past the Mad Pumpkin Head. Mages: go meet her.", null], ["Murkwater Cave and Catacombs: clear them and spare Patches (he becomes a merchant). Watch for an invader; Yura may help.", "Patches (Murkwater Cave)", "Patches is a thief who returns all game. Beating him at half health and accepting his surrender makes him a merchant, and that is what lets him show up later at Scenic Isle, Mt. Gelmir, Volcano Manor, the Shaded Castle and finally back at Murkwater Cave. Killing him instead cuts all of that off. His trap chest also teleports you near Mistwood, which is the start of the next area."], ["Stormhill Shack: Roderika starts her quest and gives Sitting Sideways and Spirit Jellyfish Ashes. Grab the Golden Seed and Stonesword Key nearby.", "Roderika (Roundtable Hold)", "Roderika is the Heartbroken Maiden at Stormhill Shack who becomes the Spirit Tuner. After you deliver her message in Stormveil and bring back the Chrysalids' Memento she moves to Roundtable Hold, gives you a Golden Seed and lets you upgrade spirit ashes there. Spirit ashes are one of the best ways to survive the next ten bosses, so this unlocks real strength, not just a quest tick."], ["Warmaster's Shack: Bernahl sells Ashes of War. At night a Bell Bearing Hunter appears (Bone Peddler's Bell Bearing). A Deathbird roams the southern night hills (Blue-Feathered Branchsword).", null], ["Free Alexander (the Potboy) near the bridge with heavy attacks from behind: Triumphant Delight gesture and Exalted Flesh.", null], ["Deathtouched Catacombs (before the bridge): Uchigatana, Assassin's Crimson Dagger, Deathroot. D, Hunter of the Dead can be met past the bridge.", null], ["Leave the Tree Sentinel until you have a horse and more levels (reward: Golden Halberd).", "Tree Sentinel (optional, come back later)", "The Tree Sentinel is a golden knight on a horse guarding the road near The First Step. It is the game's first 'you are not ready' marker: hit hard, tanky and fast. Come back with Torrent, some levels and a stronger weapon and it becomes a fair, rewarding fight rather than a wall."], "# East Limgrave · Lv 10-20 (+1/+2)", ["Rune Bears hit far above your level: loot and leave.", null], ["Kenneth Haight (north ruins): clear the demi-humans and agree to serve him.", null], ["Third Church of Marika: Flask of Wondrous Physick and Crimson Crystal Tear. The portal behind it leads to Melina, who offers Roundtable Hold.", "Flask of Wondrous Physick (Third Church of Marika)", "The Flask of Wondrous Physick is a second, customizable flask. You fill it with Crystal Tears (found all over the map), each of which gives a temporary effect when you drink it. Every Crystal Tear you find later is useless without this flask, so grabbing it now means every tear you pick up is immediately usable. The route flags it as important for exactly this reason."], ["Pick up Golden Seeds and Sacred Tears as you pass; a Teardrop Scarab drops Ground Slam.", "Collect first Golden Seeds + Sacred Tears", "Golden Seeds are upgrade items for your Crimson Flask: you spend them at a Site of Grace for more charges. Sacred Tears do the same for how much each charge heals, at Churches of Marika. Both are free power with no stat cost, and since the flask is how you survive long bosses, collecting them as you pass is some of the cheapest strength in the game."], ["Siofra River Well lift (north structure): activate it now, ride down later.", null], ["Mistwood Ruins: do the Finger Snap gesture for the wolf to start Blaidd's quest.", "Blaidd (Mistwood Ruins)", "Blaidd is the half-wolf mercenary working for Ranni. You make him appear by asking Kalé about the wolf howl, learning Finger Snap and using it below him. He tells you he's searching for Darriwil and becomes one of your allies against Radahn, while his thread continues into Ranni's questline."], ["Fort Haight: Golden Seed outside, clear the enemies, loot the right tower for the Dectus Medallion (Left), Cookbook (6) and Bloody Slash. Report back to Kenneth for the Erdsteel Dagger.", "Dectus Medallion (Left): chest in Fort Haight tower, Mistwood", "Kenneth Haight is Limgrave's rightful heir who asks you to clear Fort Haight of bandits. The chest at the top holds the left half of the Dectus Medallion, one of two halves that together power the Grand Lift of Dectus, the lift that carries you up from Liurnia to Altus. The right half is far away in Fort Faroth in Dragonbarrow, so picking up this one early costs nothing and saves a trip. Kenneth also returns at the very end of Nepheli's quest, which makes this a small early thread you'll want later."], ["Summonwater Village: beat the Tibia Mariner for a Deathroot and Skeletal Militiaman Ashes. An underground chest has the Green Turtle Talisman.", null], "# Southern Limgrave · Lv 20-30", ["Underpass near Artist's Shack: Yura. At Lake Agheel, Flying Dragon Agheel (Torrent helps). The Dragon Heart trades at the Church of Dragon Communion via Coastal Cave.", null], ["Mages: Royal House Scroll from a corpse near Agheel Lake South grace, for Sellen's shop.", null], ["Summon Blaidd at Forlorn Hound Evergaol against Darriwil for a Somber Smithing Stone (2).", null], "# Margit and Roundtable Hold", ["Climb Stormhill, defeat Margit. This opens Stormveil's gate and gets Melina to take you to Roundtable Hold.", "Margit, the Fell Omen", "Margit blocks the road into Stormveil. Beating him is also what lets Melina take you to Roundtable Hold, the hub where almost every NPC questline in the game branches. Margit is your first real check on whether your build, flask and spirit ashes are working."], ["At the Hold, talk to every NPC, buy and upgrade. Convince Hewg to take Roderika as apprentice (she becomes your spirit tuner).", null], ["D sends you to Gurranq at Bestial Sanctum after the Tibia Mariner. Give Gurranq nine Deathroot total; pacify (don't kill) the attacker after the fourth.", null], ["Fia: speak in her room (the secret option gives Baldachin's Blessing). Corhyn: intro and incantations only for now. Diallos: exhaust his dialogue.", null]], "weeping": ["# Weeping Peninsula · Lv 20-30", ["Irina is on the road; rest at Castle Morne Rampart. Night's Cavalry here drops Barricade.", null], ["Oridys's Rise: use the jump spring, hit 3 turtles to open it; Memory Stone inside.", null], ["Forest Lookout Tower: Hand Ballista. Demi-Human Forest Ruins: Demi-Human Queen's Staff (or Meteorite Staff in Swamp of Aeonia).", null], ["Faith-knot Crystal Tear (plants guard it), Sacred Tear church, Tombsward Catacombs.", null], ["Minor Erdtree: defeat the Erdtree Avatar for Crimsonburst and Opaline Bubbletear. A Walking Mausoleum roams nearby.", "Erdtree Avatar", "The Erdtree Avatar guards a Minor Erdtree on the peninsula. It is optional and drops resources; beating it makes this area safer to explore."], ["West of it: another Sacred Tear church and the Isolated Merchant's Shack. Sellen is at Witchbane Ruins but can't be spoken to yet.", null], ["Castle Morne: Golden Seed and map piece on the way; find Edgar in the tower. Defeat the Leonine Misbegotten.", "Leonine Misbegotten (Castle Morne)", "Castle Morne is the peninsula's legacy-style area guarded by the Leonine Misbegotten. The castle is also where Irina and Edgar's questline plays out, so clearing it lets you progress that thread."], ["Finish Irina's quest, but wait until your weapon is around +8: her reward is a +8 weapon and raises matchmaking.", "Irina / Edgar (Castle Morne)", "Irina's quest is a sad, short questline about delivering a letter. Its final reward is a +8 weapon, which jumps your weapon level well above where you probably are. If you finish too early your online matchmaking is based on that higher level, which can pair you with tougher players, so the route says to hold the last step until your weapon is around +8."]], "stormveil": ["# Stormveil Castle · Lv 30-40", ["Strength-Knot Crystal Tear near Stormhill Shack (a giant guards it). Castleward Tunnel grace sits before a mini-boss.", null], ["Take the alternate entrance (Gostoc's tip). Loot Golden Runes and Ruin Fragments outside.", null], ["Inside: Rusty Key from the Banished Knight, Curved Sword Talisman, Stonesword Keys, Claw Talisman, Pike, Wooden Greatshield, Golden Seed, Furlcalling Finger Remedy, Exile armor (chance).", null], ["Grafted Scion (optional, 1176 runes): Chrysalids' Memento and Highland Axe.", null], ["Rogier's line: Stormcaller from a Teardrop Scarab, Secluded Cell grace. Find Rogier by the chapel altar.", "Rogier (Roundtable Hold)", "Rogier is a sorcerer who starts in the castle's chapel before Godrick and moves to Roundtable Hold afterward. He gives items and is the first step of the Black Knifeprint line that you finish later in Liurnia, so meeting him here keeps that line open."], ["Rooftop: dozing gesture and Mimic's Veil chest.", null], ["Talk to Nepheli Loux in the courtyard so she can be summoned for Godrick.", "Nepheli Loux (castle)", "Nepheli Loux is a warrior you can summon to help against Godrick. Meeting her here starts her questline, which ends much later: after Morgott, in the Stormveil throne room, where Kenneth Haight names her ruler of Limgrave."], ["Lion Guardian: 1428 runes, Somber Smithing Stone (1), Beast Blood, Old Fang.", null], ["Defeat Godrick the Grafted (Great Rune + Remembrance).", "Godrick the Grafted", "Godrick is the first Shardbearer. His Great Rune is one of the seven; any two let Enia open the way into Leyndell. Beating him also opens the road into Liurnia and gives you the first real boss victory that matters to the main story."], ["Basement: the praying spirit gives the Shabriri Grape.", null], ["Restore Godrick's Great Rune at the Divine Tower bridge in Limgrave (raises all attributes).", "Restore Godrick's Great Rune (Divine Tower of Limgrave)", "A Great Rune must be restored at a Divine Tower before it can be used. Godrick's tower is the Divine Tower of Limgrave on Stormhill. Skipping it means the rune does nothing when you equip it, so do it while you are close."], ["Back at the Hold: Nepheli gives an Arsenal Charm, Rogier gives Rogier's Rapier +8 (matchmaking warning). Varre's Bravo gesture is at First Step grace.", null]], "liurnia": ["# Liurnia South · Lv 40-50", ["Meet Boc at the first grace, Hyetta (she wants the Shabriri Grape) and Thops (sorcery basics).", null], ["Academy Scroll (NW graveyard) for Sellen. Glintstone Craftsman's Cookbook (1), Nomadic Merchant.", null], ["Laskyar Ruins: Cookbook (2), Ritual Pot and Wraith Calling Bell in the basement chest.", null], ["Rya: fetch her necklace from Blackguard Big Boggart (1000 runes).", "Rya: Volcano Manor Invitation", "Rya the Scout asks you to retrieve her necklace and then gives you an invitation to Volcano Manor. It is an early way into Mt. Gelmir's story, which otherwise sits much later in the route."], ["Don't move Boggart early or he vanishes as a later merchant.", null], ["Night Deathbird north of Rya's spawn drops the Red-Feathered Branchsword. Dexterity-Knot Crystal Tear on an island NW of the Telescope. Patches at Scenic Isle.", null], ["Golden Seed near Academy Gate Town. Rose Church: Cookbook (12) and Varre (give him five Festering Bloody Fingers, use three on invasions for Lord of Blood's Favor).", null], ["Latenna: beat the Bloodhound Knight in Lakeside Crystal Cave to reach her at the Slumbering Wolf's Shack. Her end comes with the Right medallion half later.", null], ["Malefactor's Evergaol. Diallos stands north of Academy Gate Town; return to the Hold to finish his talk.", null], ["Academy Glintstone Key: map it and sneak or fight the Glintstone Dragon Smarag guarding it.", "Academy Glintstone Key", "The Glintstone Key is the physical key that opens the gate of Raya Lucaria Academy. There are two in the game; one is outside near the Glintstone Dragon Smarag, and one is inside the academy. Without it you cannot proceed to Rennala."], "# Raya Lucaria Academy · Lv 50-60", ["Crystalline Woods: Golden Seed and Crab Eggs, Smithing Stone (2), Teardrop Scarab for Charge Forth.", null], ["Church of the Cuckoo: Rune Arc behind an illusory wall, Marionette Soldier Ashes, Spectral Lance (Teardrop Scarab).", null], ["Carian Knight Set near the tombstone, Gravity Well from the Slender Wayfarer, Longtail Cat Talisman (Pendulum Statue), Lost Ashes of War on the crystal pile.", null], ["Schoolhouse Classroom: Conspectus Scroll, Cookbook (5), Olivinus Glintstone Crown, Smithing Stone (5) by the iron ball trap.", null], ["Red Wolf of Radagon: 14000 runes and a Memory Stone. Debate Parlor grace.", "Red Wolf of Radagon (Raya Lucaria)", "Raya Lucaria Academy is a legacy dungeon whose goal is Rennala. Along the way you meet the Red Wolf of Radagon and Moongrum, and the iron ball trap, and you finish the dungeon by taking the main elevator."], ["Courtyard: Stonesword Key, Golden Seed, Karolos crown, Glintstone Whetblade. Rooftops: Imbued Sword Key, the Academy Glintstone Key (chandelier corpse), Shattering Crystal, Twinsage crown, Azur's Glintstone Staff.", null], ["Moongrum, Carian Knight: Carian Knight's Shield.", null], ["Defeat Rennala (Great Rune of the Unborn, respec unlocked).", "Rennala, Queen of the Full Moon", "Rennala is the Shardbearer who leads the academy. Her Great Rune of the Unborn is one of the seven, and beating her unlocks the full-moon respec, so you can fix your build before the long climb ahead."], ["Thops at Church of Irith: buy sorceries first, then hand him the key after Rennala.", "Thops: give him the Academy Glintstone Key after Rennala", "Thops sells sorceries directly only until you give him the Academy Key. After that his shop closes, so buy first. He then goes into the academy and the key is how his quest progresses."], "# Liurnia East · Lv 50-60", ["Treespear on the caravan at the collapsed bridge. Cliffbottom Catacombs: Gloveworts and Kaiden Sellsword Ashes.", null], ["Purified Ruins: Shabriri Grape and Hyetta's second location. Give grapes to Hyetta at Gate Town Bridge.", null], ["Highway Lookout Tower: Carian Glintblade Staff, Cookbook (3). Gate Town Bridge at night: Night's Cavalry drops Ice Spear.", null], ["Artist's Shack: Resurrection Painting, grace, Smithing Stone (4). Tibia Mariner boss here gives Dragon Cult Prayerbook.", null], ["Jarburg: jump off the cliff, don't attack the Living Jars, speak to Jar Bairn.", null], ["Church of Vows: Miriel, Absolution (cleanses sin with Celestial Dew), Gold Sewing Needle and Golden Tailoring Tools.", null], ["Eastern Liurnia: Flame, Cleanse Me! and Fire Monk drops. Minor Erdtree Avatar for shrouding tears. Walking Mausoleum bell unlocks by landing on it from the spirit spring.", null], ["Raya Lucaria Crystal Tunnel: Smithing-Stone Miner's Bell Bearing (1).", null], ["Bellum Highway and Frenzied Flame Village (Madness: avoid the Eye): Frenzied's Cookbook (1), Shabriri's Woe, Fingerprint Grape from invader Vyke, Finger Maiden Set. Varre gives a Bloody Finger and the Pureblood Knight's Medal (don't use yet).", null], ["Converted Fringe Tower: Erudition gesture with a Glintstone Crown breaks the seal; Cannon and Gavel of Haima at the top.", null], ["Black Knife Catacombs: beat the Phantom Knight, grab the Black Knifeprint, give it to Rogier; Fia then gives the Sacrificial Twig.", null], ["Optional: Yura invasion at the Main Academy Gate; Boc appears here, keep the Gold Needle and Tools for his last location. Bellum Church Sacred Tear.", null], ["Ainsel River Well is guarded by a golem (east from Eastern Lake Shore grace, then north).", null], "# Ainsel River · Lv 50-60", ["Smithing Stone (3) for +9. Map, Nomadic Merchant, Immunizing Horn Charm.", null], ["Malformed Star: approach via the right-hand path behind the large statue (does not respawn).", null], ["Wing of Astel in an upper area is reachable later through Ranni's quest.", null], ["Dragonkin Soldier of Nokstella (boss room): Frozen Lightning Spear.", null], "# Liurnia West · Lv 60-70", ["Folly on the Lake grace (ride Torrent to avoid poison). Crystal Sword over the bridge; Omenkiller field boss (Crucible Knot).", null], ["Village of the Albinaurics: Nepheli's quest, Larval Tear in a coffin. Hit the pot Albus for the Right medallion half.", "Haligtree Secret Medallion (Right): Village of the Albinaurics, hit pot Albus", "Albus the pot is an old Albinauric in the Village of the Albinaurics. Hitting him gives you the right half of the Haligtree Secret Medallion. You need both halves to open the Consecrated Snowfield much later, and getting this one now avoids a trip back."], ["Latenna at Slumbering Wolf's Shack takes the medallion.", null], ["Roundtable Hold after the village boss: Nepheli talks, Gideon dialogue. Ensha invades; Clinging Bone and Royal Remains Set (Gideon's room).", null], ["Converted Tower: Erudition gesture for a Memory Stone. Minor Erdtree north of Folly: Cerulean and Ruptured Crystal Tears.", null], ["Road's End Catacombs: Spirit Ashes and materials. If Irina's quest is done, Edgar invades Revenger's Shack (Shabriri Grape, Banished Knight's Halberd +8).", null], ["Cuckoo's Evergaol: Greatblade Phalanx.", null], ["The Four Belfries: Imbued Sword Key at top. Grafted Scion and The Stormhawk King here. Nepheli's progress can go on or wait.", null], ["Lower road north: Carian Knight's Sword from a caravan, Map (Liurnia, West), Kingsrealm Ruins; illusory wall reveals the Manor road grace.", null], ["Smithing Master Iji: upgrades and materials; Carian Filigreed Crest if you summoned Blaidd.", null], ["Caria Manor: Cookbook (6), Golden Seed, merchant Pidia. Defeat Royal Knight Loretta (mages get Loretta's Greatbow).", "Royal Knight Loretta (Caria Manor)", "The Four Belfries lead toward Caria Manor, where Royal Knight Loretta guards the way up to Ranni's Rise. Beating Loretta is what lets you finally meet Ranni at her tower."], ["Heads up: a Glintstone Dragon (Adula) lurks in the area beyond Caria Manor, near Ranni's Rise. It is optional; the wiki flags it so you can plan or avoid it.", null], ["Three Rises here, only Ranni's Rise is open now (west). Meet Ranni to start The Hidden Treasure of Nokron.", "Ranni the Witch (Ranni's Rise)", "Ranni's Rise is where Ranni accepts you as her servant, which starts the main thread of her quest. The path forks here: Seluvis, her puppeteer, offers a betrayal route that fails her quest. The route recommends staying loyal."], ["After a time skip: Rogier's reward appears (Spellblade Set, Bell Bearing, letter). Talk to Iji, Blaidd and Seluvis (spectral forms on the first floor), then talk to Ranni and leave.", null], ["WARNING: Seluvis's questline betrays Ranni and fails her quest. It can be recovered with Absolution at the Church of Vows. The potion goes to Nepheli, Gideon or Dung Eater: giving it to Nepheli or Dung Eater ends their quest early.", null], ["Between Ranni's and Renna's Rise: illusory wall hides stairs to Seluvis. Buy a puppet, exhaust dialogue, loot the memory stone chest upstairs.", null], ["Blaidd waits in Siofra River. Seluvis points you to Sellen, who says Radahn stopped the stars.", "Sorceress Sellen / Jerren", "Sorceress Sellen teaches sorceries and connects you to the Radahn festival, since she tells you that defeating Radahn will free the stars."], ["Cursemark of Death sits at the top of the Divine Tower of Liurnia (via the Carian Study Hall secret area, Preceptor Miriam, Mask of Confidence).", "Cursemark of Death (Divine Tower of Liurnia)", "The Divine Tower of Liurnia holds the Cursemark of Death, which Fia's questline needs later to progress. The tower has an attacker, Preceptor Miriam, who appears the moment you enter the secret area."], ["After Radahn: fetch the Fingerslayer Blade in Nokron and return it to Ranni for the Carian Inverted Statue.", "Ranni: Fingerslayer Blade (Nokron)", "Once Radahn is dead, the crater in Limgrave opens the way into Nokron. The Fingerslayer Blade is in there, and Ranni cannot continue without it, so it is a hard gate in her quest."], ["Free Alexander in eastern Liurnia with an Oil Pot.", null]], "ainsel": ["# Ainsel River & Nokstella · later (Lv 80+)", ["Return after Ranni's quest: Ainsel River Main via Renna's Rise waygate, Miniature Ranni in a coffin.", null], ["Dragonkin Soldier of Nokstella: finish it if you skipped earlier.", "Dragonkin Soldier", "The Dragonkin Soldier of Nokstella is the Ainsel River boss; defeating it gives the grace that lets you continue toward Nokstella and Ranni's story."], ["Nokstella: Moon of Nokstella talisman, Golden Seed by the elevator, two Larval Tears.", null], ["Baleful Shadow (south of Nokstella Waterfall Basin) drops the Discarded Palace Key.", null], ["Raya Lucaria Grand Library chest: Dark Moon Ring (Ranni's ending).", null], ["Lake of Rot: Scarlet Rot, bring Preserving Boluses or Flame, Cleanse Me. Raise islands with four pillar buttons. Dragonkin Soldier at the center, then Grand Cloister, then Astel (Naturalborn of the Void).", null], ["Moonlight Altar: Glintstone Dragon Adula, then the Cathedral of Manus Celes. Side areas: Cerulean Amber Medallion +2, Chelona's Rise (Ranni's Dark Moon), Ringleader's Evergaol (Black Knife Tiche).", null], ["Blaidd outside Ranni's Rise: Royal Greatsword and Blaidd's Set. Iji: Iji's Mirrorhelm and Bell Bearing.", null]], "siofra": ["# Siofra River · Lv 60+ (+8-12)", ["Enter via the Siofra River Well from Mistwood. Ancestral Followers are dangerous at range.", null], ["Armorer's Cookbook (6) and the Siofra map. Light eight fire pillars, then fight the Ancestor Spirit.", "Ancestor Spirit (Siofra River)", "Siofra River is entered by a lift from the Siofra River Well. Lighting the eight pillars near the stairs to the Hallowhorn Grounds opens the path to the Ancestor Spirit's arena."], ["Optional Dragonkin Soldier (Dragon Halberd, Marika's Scarseal nearby). Golden Seed and Below the Well grace by dropping north.", null], "# Nokron, Eternal City · Lv 70+ (+15-20)", ["Reach Nokron from Mistwood via the crater west of Fort Haight. Winged Scythe jumps lead to the Ghostflame torch.", null], ["Collect Bell Bearing, Larval Tears, Rune Arc, Ghost Gloveworts.", null], ["Mimic Tear boss (Silver Tear Mask).", "Mimic Tear (Nokron)", "Nokron is the sunken city that only opens once Radahn is beaten. The Mimic Tear is a boss that copies you; it sits behind a mist door."], ["Night's Sacred Ground: Black Whetblade; Stonesword Key room holds Mimic Tear Ashes; beware the disguised Silver Tear and the one that turns into a Troll.", "Mimic Tear Ashes (chest)", "The Mimic Tear Ashes are in a chest in Night's Sacred Ground behind an imp statue door that needs a Stonesword Key. They summon a copy of you and are one of the best spirit ashes in the game."], ["Hidden Treasure chest under the giant skeleton holds the Fingerslayer Blade.", null], ["Light the six Hallowhorn altars, then the Regal Ancestor Spirit.", "Regal Ancestor Spirit", "The Regal Ancestor Spirit is in an arena reached from Nokron. It is the second Ancestor Spirit boss in the underground and is optional if you want to move faster."], "# Siofra Aqueduct", ["An NPC gives the Inner Order gesture for the Twinned Set. Order Healing and Missionary's Cookbook (5) on the platforms.", null], ["Valiant Gargoyles at the waterfall. The coffin north of Great Waterfall Basin leads to Deeproot Depths; get the Cursemark from Ranni first.", null]], "caelid": ["# Caelid South · Lv 60+ (+10-12)", ["Enter from Summonwater via Rotview Balcony. Ambushes at the buildings.", null], ["Smoldering Church: beat invader Anastasia, loot two cookbooks. Minor Erdtree: Putrid Avatar, Flame-Shrouding and Greenburst tears.", null, "Caelid is a dangerous, rot-filled region that sits next to Limgrave. The sites here are Smoldering Church, Fort Gael, Sellia and the War-Dead Catacombs, which give resources and the Golden Scarab. It is the main way to reach Radahn."], ["Abandoned Cave (Scarlet Rot: use Immunity gear and Boluses): Cleanrot Knight duo drops the Gold Scarab.", null], ["Gael Tunnel: Magma Wyrm (Dragon Heart, Moonveil). Use the rear entrance to trigger Alexander's scene.", null], ["Invisible Teardrop Scarab near Fort Gael North gives Flame of the Redmanes. Fort Gael: Starscourge Heirloom, Katar, Lion's Claw.", null], ["Gaol Cave (Stonesword Key): Frenzied Duelist drops Putrid Corpse Ashes. Caelid Waypoint Ruins: Meteoric Ore Blade.", null], ["Decaying Ekzykes, an optional dragon, drops a Dragon Heart. Night's Cavalry in Southern Aonia Swampbank at night; Death Rite Bird nearby.", null], ["Cathedral of Dragon Communion and Caelid Catacombs (Miranda Ashes).", null], ["Sellia Crystal Tunnel: Fallingstar Beast, Somberstone Bell Bearing (1). Gowry sends you for the Unalloyed Gold Needle (Commander O'Neil).", null], ["Sellia, Town of Sorcery: Church of the Plague (Millicent). Hand over the needle, get the Prosthesis-Wearer Heirloom, move Millicent to Altus.", "Millicent, Gowry, Needle Knight Leda", "Millicent's quest is one of the longest in the game and crosses Caelid, Altus, the Mountaintops and the Haligtree. It begins with Gowry and the Unalloyed Gold Needle and ends with a choice that changes your rewards, so starting it now keeps you on track."], ["Redmane Castle: talk to Alexander and Blaidd first. If the Old Geezer loops, speak to Iji at Caria Manor and return.", null], ["Defeat Starscourge Radahn; afterward talk to Alexander and Blaidd.", "Starscourge Radahn (Redmane Castle festival)", "Alexander and Blaidd both fight beside you against Radahn. Talking to them first sets up that help and moves their questlines along. If the Old Geezer loops, talk to Iji at Caria Manor first."], ["War-Dead Catacombs is optional and hard (about Lv 80+).", null], ["Gurranq at Bestial Sanctum for Deathroot (tough this early).", "Gurranq, Beast Clergyman (Deathroot)", "Gurranq the Beast Clergyman at the Bestial Sanctum gives rewards for Deathroot, which you collect by killing Those Who Live in Death. The Deathroot questline began at Summonwater Village, and the sanctum itself is dangerous this early."], ["Bernahl waits at the Warmaster's Shack in Stormhill.", "Knight Bernahl (Warmaster's Shack)", "Knight Bernahl lives at the Warmaster's Shack in Stormhill and his quest only truly begins once you pledge to Volcano Manor. He later joins the manor as Recusant Bernahl."]], "deeproot": ["# Deeproot Depths · Lv 70+ (+15-20)", ["Only reachable through the coffin in Siofra Aqueduct. This area gives a faction choice for endings.", null], ["Erdtree Avatar (Staff of the Avatar, Golden Land). Palm Reader for lore; Vacuum Slice nearby.", null], ["Walking Mausoleum: beat Crucible Knight Siluria, then hit the white skulls to despawn its enemies.", null], ["Fia's Champions (optional, Fia's Mist).", "Fia’s Champions", "Fia's Champions is an optional boss fight. Beating it opens the Prince of Death's Throne grace, but the quest itself can progress without more fighting."], ["Talk to Fia, give her the Cursemark of Death.", "Fia / Deathbed Companion quest", "Fia, the Deathbed Companion, is a quest character at the Prince of Death's Throne. She needs the Cursemark of Death from the Divine Tower of Liurnia, and her questline feeds directly into one of the endings."], ["Enter Godwyn's dream and defeat Lichdragon Fortissax (Remembrance). Receive the Mending Rune of the Death-Prince for the alternate ending.", "Lichdragon Fortissax", "Lichdragon Fortissax is the Deeproot Depths boss. It is optional and sits at the end of the area."], ["If you gave the Twinned Set to D's Twin Brother, he appears after Fia's quest with the Inseparable Sword.", null]], "altus": ["# Altus Plateau · Lv 60+ (+10-14)", ["Enter via Ruin-Strewn Precipice or both Dectus halves (right half is in Fort Faroth, Caelid).", "Use both Dectus halves at Grand Lift of Dectus (Liurnia -> Altus)", "Altus Plateau is reached either by the Grand Lift of Dectus (with both medallion halves) or by Ruin-Strewn Precipice. This is the golden-lit region between you and Leyndell."], ["Brother Corhyn starts his quest at Roundtable Hold.", null], ["Perfumer's Ruins (Omenkiller Set), Unsightly Catacombs, Sage's Cave (Garris, Black Knife Assassin).", null], ["Lansseax (optional dragon), Millicent, Erdtree-Gazing Hill, Lux Ruins, Greatshield Talisman.", null], ["Wyndham Catacombs: Tibia Mariner, Deathroot, Glovewort Bell Bearing. Old Altus Tunnel: Stonedigger Troll.", null], ["The Shaded Castle: Valkyrie's Prosthesis for Millicent. Maleigh Marais invader gives House Marais Set.", null], ["Godefroy the Grafted (Golden Lineage Evergaol). Boc appears at Altus Highway Junction; Night's Cavalry roams at night.", null], ["Second Church of Marika: Eleonora invades. Wormface guards the Minor Erdtree (Speckled Hardtear).", null], ["Mirage Rise: find three symbols for Unseen Form and Unseen Blade. Dominula: Godskin Apostle to advance Millicent.", null], ["Sainted Hero's Grave: Black Knife Assassin. Goldmask and the Radiant Gold Mask: Corhyn moves to Goldmask.", "Goldmask / Corhyn", "Corhyn and Goldmask are an NPC pair whose questline spans Altus, Leyndell, the Mountaintops and the Ashen Capital. It must be advanced before the Erdtree burns or Corhyn disappears and Goldmask never appears."], ["Writheblood Ruins: optional Sanguine Noble. Corpse-Stench Shack: Anastasia invasion, Golden Vow.", null], ["Amber Starlight for Seluvis (the betrayal path is optional).", null], ["Capital Outskirts approach: the Draconic Tree Sentinel guards the way to Leyndell.", "Draconic Tree Sentinel (Capital Outskirts)", "The Draconic Tree Sentinel guards the road into Leyndell from the Capital Outskirts, the last stop before the capital."]], "gelmir": ["# Mt. Gelmir · Lv 80+ (+15-20)", ["Seethewater Cave (Stonesword Key), Fort Laiedd, Magma Wyrm, Gelmir Hero's Grave, Fallingstar Beast.", null], ["Alexander's fifth step (the Jar): speak from the safe rock above the lava.", null], ["Hermit's Shack, Hermit Village (Demi-Human Queen Maggie drops a Memory Stone), Primeval Sorcerer Azur. Patches ambushes at the rainbow stones.", null], ["Road of Iniquity grace and Gelmir map.", null], ["Join Volcano Manor; Tanith gives three requests, report to Rya, Bernahl and Diallos after each.", "Volcano Manor: Tanith, Rya, Patches", "Volcano Manor is the assassin's guild-style questline run by Tanith. You join it, take contracts and eventually fight Rykard."], ["Patches (Bull-Goat Set), Bernahl (Raging Wolf Set), Rya (Daedicar's Woe or Tonic of Forgetfulness).", "Bernahl + Fortified Manor summon fights (Varagram, Willem)", "Bernahl moves into Volcano Manor and his quest completes alongside the contracts. It links to the Fortified Manor summons."], ["WARNING: finish every Volcano Manor NPC quest before Rykard or lose their rewards until NG+.", "Complete all Volcano Manor contracts", "Each contract (Istvan, Rileigh, Juno Hoslow) unlocks other NPCs' quests. If you kill Rykard first, those rewards are locked until NG+."], ["Elemer's bridge (Shaded Castle) gives Dancer's Castanets for Tanith. Jarburg: reload several times for Diallos and Jar Bairn.", null], ["Sellen's line: Sellia Hideaway (Master Lusat), Witchbane Ruins, Seluvis's puppet room, Witch-Hunter Jerren; choose Sellen or Jerren at the Grand Library.", null], ["Defeat Rykard (after the quests above).", "Rykard, Lord of Blasphemy", "Rykard is a Shardbearer whose Great Rune also counts toward Leyndell. Only kill him after finishing every Volcano Manor questline."]], "dragonbarrow": ["# Dragonbarrow · optional", ["Loot the right Dectus Medallion at Fort Faroth.", "Dectus Medallion (Right): Fort Faroth", "Fort Faroth holds the right half of the Dectus Medallion; with the left half from Fort Haight it powers the Grand Lift of Dectus."], ["Greyoll, Godskin Apostle set, Sky Shot ash, Gravity Stone. Optional story notes at Bestial Sanctum.", "Greyoll (optional)", "Dragonbarrow is an optional, high-level area. The route recommends level 80 and above, and its loot is a bonus rather than a requirement."]], "leyndell": ["# Leyndell Outskirts · Lv 90-110 (+15-20)", ["Approach from the south via Altus Highway Junction and the bridge.", null], ["Tree Sentinel duo (optional, Erdtree Greatshield). Outer Wall Phantom Tree grace. Two Golden Seeds and the Leyndell map.", null], ["Small military camp: Lesser Ulcerated Tree Spirit (Golden Seed), Giant-Crusher chest. Minor Erdtree Church: Cookbook (4), Golden Order Seal.", null], ["Sealed Tunnel: hit an illusory wall for Smithing-Stone Miner's Bell Bearing (2) and materials.", null], ["Onyx Lord tunnel links to the Divine Tower of West Altus (activate Rykard's Rune there). Margit optional fight: Viridian Amber Medallion +1.", null], ["Hermit Merchant's Shack: Bell Bearing Hunter and Deathbird invade at night. Winged Crystal Tear altar, then the Minor Erdtree.", null], ["Blackguard Big Boggart: buy Boiled Crab, reload for extra dialogue, optional Seedbed Curse.", null], ["Auriza Hero's Grave and Side Tomb: armor, weapons, Soldjars of Fortune, Gloveworts.", null], ["Defeat the Draconic Tree Sentinel (Dragon Greatclaw) to open the legacy dungeon.", null], "# Leyndell, Royal Capital", ["Upgrade and optimize gear first. Have two Great Runes and talk to Enia to enter.", "Have 2 Great Runes + talk to Finger Reader Enia (Roundtable) to enter", "Enia the Finger Reader at Roundtable Hold checks that you have at least two Great Runes before Leyndell will let you in. Any two from the seven will do."], ["Enter, reach the Erdtree Sanctuary, defeat Godfrey (Golden Shade).", "Godfrey, First Elden Lord (Golden Shade)", "Godfrey's golden shade is the first major fight inside Leyndell, near the West Capital Rampart."], ["Queen's Bedchamber: defeat Morgott.", "Morgott, the Omen King", "Morgott is the Omen King and a Shardbearer. Beating him gives his Great Rune and, after you fail to enter the Erdtree, Melina gives you the Rold Medallion."], ["Grab the capital loot before it ashens.", "Grab Capital loot before ashening: Bolt of Gransax, Golden Order Principia, Erdtree Bow, Celestial Dew", "Parts of Royal Capital are lost once Maliketh falls and the city turns ashen: the Bolt of Gransax, the Golden Order Principia, the Erdtree Bow and the Celestial Dew. Collect them first."], ["Seedbed Curses (3 spots).", "Seedbed Curses (3 spots)", "Seedbed Curses are items used for the Dung Eater questline. They are found in specific spots in the capital that are lost later."], ["Golden Order Principia near the Sanctuary: give to Corhyn for Law of Regression, cast it on the message by the Radagon statue, report to Goldmask.", "Goldmask + Brother Corhyn questline", "The Goldmask riddle must be solved in Leyndell before the Erdtree burns, otherwise Corhyn vanishes and Goldmask never returns."], ["Boc: hand over the Gold Needle and Tools. Larval Tear moves him to the Academy; the Prattling Pate keeps him in his room.", null], ["After Morgott: Nepheli, Kenneth and Gostoc at the Godrick site (Ancient Dragon Smithing Stone).", "Nepheli Loux: crown her ruler of Limgrave", "Nepheli's questline has its final step in the Stormveil throne room, and it only triggers after Morgott. Several earlier steps must happen in order."], ["Dung Eater appears in the Hold; with a Seedbed Curse he gives the Sewer-Gaol Key.", null], ["Subterranean Shunning-Grounds opens here but is tough; recommended later.", null], ["Sir Gideon is fought later in the Ashen Capital.", "Sir Gideon Ofnir (Ashen Capital)", "Sir Gideon Ofnir is the All-Knowing; he is fought in the Ashen Capital after Farum Azula, not here."]], "mountaintops": ["# Forbidden Lands · Lv 90+ (+20-24)", ["Melina gives the Rold Medallion after Morgott; ride the Grand Lift.", "Rold Medallion (Melina, after Morgott) -> Grand Lift of Rold", "After you fail to enter the Erdtree, Melina gives you the Rold Medallion. Using it at the Grand Lift of Rold carries you up to the Mountaintops of the Giants."], ["Night's Cavalry (night, Phantom Slash), Black Blade Kindred before the lift, Golden Seed to the north. Talk to the Palm Reader by the lift.", null, "The Forbidden Lands are the first area past Leyndell. Night's Cavalry only appears at night and there is a Golden Seed and Black Blade Kindred here."], "# Mountaintops of the Giants · Lv 90+", ["Area Map, talk to Shabriri, Zamor Ruins (Bell Bearing 3), Ancient Snow Valley.", null], ["Giants' Mountaintop Catacombs, Briars of Punishment, Shack of the Lofty (Traveling Maiden Set; Juno Hoslow if doing Volcano Manor).", null], ["Stargazer's Ruins, Minor Erdtree Avatar, talk to Corhyn. Heretical Rise via invisible path: Founding Rain of Stars.", null], ["Frozen Lake snowstorm lasts until Borealis is defeated. First Church of Marika (Sacred Tear, Bell Bearing 3).", null], ["Giant-Conquering Hero's Grave needs two Stonesword Keys: Ancient Hero of Zamor.", null], ["Church of Repose: Okina invades (Rivers of Blood); Ancient Dragon Smithing Stone on the cliff skull.", null], ["Castle Sol: Death Rite Bird invasion; defeat Commander Niall.", "Commander Niall (Castle Sol)", "Commander Niall guards Castle Sol. The tower roof behind him holds the left Haligtree Secret Medallion half."], ["Fire Giant at the Foot of the Forge (optional order: Fire Giant then Snowfield, or Snowfield first).", "Fire Giant", "The Fire Giant stands between you and the Forge of the Giants. Beating him opens the final stretch toward the forge."], ["Volcano Manor line: fight Juno Hoslow at Shack of the Lofty, then return.", null, "Juno Hoslow at Shack of the Lofty is the last Volcano Manor contract, and Tanith should be revisited after."], ["Three Fingers in the Shunning-Grounds: touching them locks you into the Frenzied Flame ending.", "Three Fingers (meet) — needed for Shabriri summon; frenzy needs Miquella's Needle if not wanted", "The Three Fingers are the entities behind the Frenzied Flame ending. They are in the sewers under Leyndell, and touching them locks you into that ending."], ["The Forge of the Giants is the point of no return: finish quests first.", "Forge of the Giants: do NOT burn the Erdtree until quests are done", "The Forge is where Melina asks if you will commit the sin of burning the Erdtree. Accepting teleports you to Crumbling Farum Azula. It is the point of no return for many NPC quests, so finish them first."]], "snowfield": ["# Consecrated Snowfield · Lv 90+", ["Take the left Secret Medallion from the Castle Sol roof after Niall.", "Haligtree Secret Medallion Left: Castle Sol roof, after Niall", "The Haligtree Secret Medallion has two halves: the left is on the Castle Sol roof and the right is in the Village of the Albinaurics in Liurnia. Both are needed to open the Snowfield."], ["Hoist the whole medallion at the Grand Lift of Rold to open the Snowfield.", "Hoist Secret Medallion at bottom of Grand Lift of Rold", "At the Grand Lift of Rold you stand at the bottom and switch the action to Hoist Secret Medallion. It does not work from the top."], ["Hidden Path to the Haligtree: Grave Glovewort (9), Deathroot, Amon Ashes, Spelldrake Talisman +2. Catacombs: Great Grave Glovewort.", null], ["Night's Cavalry double boss. Yelough Anix Tunnel: Astel, Stars of Darkness (Meteorite of Astel).", null], ["Sanguine Noble invasion; note the blood gateway to Mohgwyn Palace. Albinauric Rise: Graven-Mass Talisman.", null], ["Apostate Derelict: Silver Mirrorshield; Latenna's quest ends here. Cave of the Forlorn: Dragon Heart.", null], ["Skip Ordina for now; lighting its four candles opens the north gate to the Haligtree.", "Ordina, Liturgical Town", "Ordina, Liturgical Town opens the path to a very hard late dungeon, which the route says to avoid for now."], ["Millicent continues in Elphael.", "Millicent: final steps in Elphael", "Millicent's quest continues into Elphael, at the Prayer Room, past the Putrid Tree Spirit."]], "mohgwyn": ["# Mohgwyn Palace · Lv 100+", ["Enter via the Snowfield gateway, or Pureblood Knight's Medal (not recommended early).", "Varre / Pureblood Knight's Medal", "White Mask Varré is the invader who gives you the Pureblood Knight's Medal after three invasions. The medal teleports you to Mohgwyn but the area is dangerous early."], ["Map in the western ruin. Blood lake: three Nameless White Masks, Haligdrake Talisman +2, Swarm of Flies.", null], ["Mausoleum: Varre invasion if following his quest, Imprisoned Merchant, Great Ghost Glovewort.", null], ["Defeat Mohg, Lord of Blood.", "Mohg, Lord of Blood", "Mohg is a Shardbearer whose Great Rune counts toward Leyndell and whose defeat is required for the Shadow of the Erdtree DLC."]], "haligtree": ["# Miquella's Haligtree · Lv 120+", ["Canopy paths (Stonesword Keys, Envoy Crown); Giant Oracle Envoy is dangerous.", null], ["Haligtree Town: Pearldrake Talisman +2, Viridian Amber Medallion +2, Ancient Dragon Smithing Stone.", null], ["Defeat Loretta, Knight of the Haligtree (promenade).", "Loretta, Knight of the Haligtree", "Loretta, Knight of the Haligtree is a boss at the end of the town and an obstacle toward Elphael."], ["Elphael: Millicent quest (assist or betray), Marika's Soreseal, Triple Rings of Light.", "Millicent finale (verify steps on wiki)", "Millicent's finale asks whether you help her or betray her; the choice changes your rewards."], ["Inner wall: Erdtree Avatar, Rotten Crystal Sword, Dragoncrest Greatshield.", null], ["Defeat Malenia (Great Rune of the Rot Goddess).", "Malenia, Blade of Miquella", "Malenia, Blade of Miquella is a Shardbearer and one of the hardest bosses. Her Great Rune and Gideon's Roundtable rewards depend on her."], ["Return the Unalloyed Gold Needle to Scarlet Aeonia for Miquella's Needle.", null], ["Gideon's Roundtable rewards need Mohgwyn and Haligtree found, Mohg and Malenia dead.", "Gideon rewards need: Mohgwyn found, Haligtree found, Mohg + Malenia dead", "Gideon's rewards require that you discovered Mohgwyn and the Haligtree and defeated Mohg and Malenia. If you miss them, the Twin Maiden Husks sell them."], ["Dung Eater: five Seedbed Curses for the Mending Rune of the Fell Curse.", null]], "farum": ["# Crumbling Farum Azula · Lv 120+", ["Melina teleports you here from the Forge of the Giants. Fire Giant first if not done.", null], ["Crumbling Beast Grave: Farum Azula Dragon, Azula Beastmen, smithing stones, Ancient Dragon Prayerbook.", null], ["Dragon Temple: defeat the Godskin Duo (Bell Bearing 4, Black Flame Tornado).", "Godskin Duo", "The Godskin Duo is the boss in the temple, and the Dragon Temple Transept grace is next to it."], ["Iron Fist Alexander: Shard of Alexander.", null], ["Optional Dragonlord Placidusax (lie down at the arena near Beside the Great Bridge; Miquella's Needle works).", "Dragonlord Placidusax", "Dragonlord Placidusax is an optional ancient dragon. The Miquella's Needle can remove the Frenzied Flame here."], ["Finish all Royal Capital NPC quests first. Gurranq changes dialogue after nine Deathroot.", "Beast Clergyman (Maliketh)", "Maliketh's fight is the point of no return. Finish Leyndell NPC quests and collect items before you start it."], ["Defeat Maliketh. Irreversible world changes until NG+.", "Maliketh, the Black Blade", "Killing Maliketh ashens Leyndell and blocks several areas and quests until NG+."]], "ashen": ["# Leyndell, Ashen Capital · Lv 150+", ["Subterranean Shunning-Grounds via a sewer hole southwest; clear it first.", null], ["Corhyn / Goldmask: Goldmask gives Mending Rune of Perfect Order, Corhyn his robe and bell bearing.", null], ["Sir Gideon Ofnir: All-Knowing Set. Erdtree Heal in the Queen's Bedchamber.", null], ["Godfrey / Hoarah Loux (fog door).", "Godfrey / Hoarah Loux", "Godfrey as Hoarah Loux, Warrior is the next boss in the Elden Throne after Gideon."], ["Radagon of the Golden Order.", "Radagon of the Golden Order", "Radagon of the Golden Order follows Hoarah Loux through the luminous barrier."], ["Elden Beast.", "Elden Beast", "The Elden Beast follows Radagon at the Elden Throne and is mandatory."], ["Pick an ending. Default: interact with Fractured Marika and Mend the Elden Ring.", "Choose ending / start NG+", "You pick your ending after the Elden Beast. The default Age of Fracture needs no questlines; others need specific NPC quests done."], "# Subterranean Shunning-Grounds · Lv 150+", ["Esgar, Priest of Blood.", "Esgar, Priest of Blood (Shunning-Grounds)", "Esgar, Priest of Blood is a boss in the Subterranean Shunning-Grounds, the sewers under Leyndell."], ["Dung Eater's cell: free him with the Sewer-Gaol Key. Sewers: Glass Shards, Ogres, Basilisks, Giant Lobsters.", null], ["Mohg, the Omen: use Mohg's Shackle to stun him.", "Mohg, the Omen (Shunning-Grounds)", "Mohg, the Omen is a boss in the Shunning-Grounds, separate from Mohg, Lord of Blood."], ["Hyetta's quest: attack the altar for a secret passage, die in the shaft to break the floor. Frenzied's Cookbook (2).", "Hyetta (Lightseeker) quest", "Hyetta's quest finishes in the Shunning-Grounds."], ["Three Fingers: interacting unlocks the Frenzied Flame ending.", null], "# Endings", ["Ranni: Dark Moon Ring at Manus Celes, summon her after the Elden Beast. Fia: Cursemark and Fortissax, Mending Rune of the Death-Prince. Goldmask: Rune of Perfect Order after Farum Azula. Dung Eater: five Seedbed Curses. Default: Age of Fracture.", null]], "dlc": ["# Shadow of the Erdtree · Lv 120+", ["Beat Radahn and Mohg, then enter Miquella's cocoon.", "Unlock: beat Radahn + Mohg, enter Miquella's cocoon"], ["Gather Scadutree Fragments and spend them at a grace.", "Collect Scadutree Fragments (blessing level)"], ["Gather Revered Spirit Ash.", "Collect Revered Spirit Ash"], ["Belurat: Divine Beast Dancing Lion.", "Divine Beast Dancing Lion"], ["Castle Ensis: Rellana.", "Rellana, Twin Moon Knight"], ["Shadow Keep: Messmer.", "Messmer the Impaler"], ["Enir-Ilim: Promised Consort Radahn.", "Promised Consort Radahn"]]};
const WHY = {"limgrave": [["Grab the map", "Maps only show an area once you pick up that region's map fragment, so until you do, graces and dungeons around you stay invisible. The Whetstone Knife is the tool that lets you change Ashes of War on a weapon, which is how you give your first real weapon an identity before Stormveil."], ["Talk to Melina", "Melina is the NPC who follows you all game. You cannot level up at a grace until you accept her as your maiden, so this is the real start of the game. She later gives you the Rold Medallion after Morgott and is the one who asks at the Forge of the Giants whether you will commit to burning the Erdtree. Torrent is the gift she gives for accepting."], ["Visit Church of Elleh", "Renna appears here at night once you have Torrent. She is actually Ranni in disguise, and this meeting starts Ranni's questline, the longest in the game and the one that opens the Age of the Stars ending. She hands you the Spirit Calling Bell and Lone Wolf Ashes, your first spirit summon, which makes Margit and Godrick much easier. If you miss her, the Twin Maiden Husks at Roundtable Hold sell both."], ["Break Boc", "Boc is a tiny seamster who was cursed into a tree. Freeing him starts a quest that follows you across the world: he turns up again in Altus and in Leyndell, and the Larval Tear choice you make with him in Leyndell decides where he ends up. Missing him early is not fatal, but the quest rewards come from meeting him in order."], ["Clear Murkwater Cave", "Patches is a thief who returns all game. Beating him at half health and accepting his surrender makes him a merchant, and that is what lets him show up later at Scenic Isle, Mt. Gelmir, Volcano Manor, the Shaded Castle and finally back at Murkwater Cave. Killing him instead cuts all of that off. His trap chest also teleports you near Mistwood, which is the start of the next area."], ["Meet Roderika", "Roderika is the Heartbroken Maiden at Stormhill Shack who becomes the Spirit Tuner. After you deliver her message in Stormveil and bring back the Chrysalids' Memento she moves to Roundtable Hold, gives you a Golden Seed and lets you upgrade spirit ashes there. Spirit ashes are one of the best ways to survive the next ten bosses, so this unlocks real strength, not just a quest tick."], ["Night's Cavalry", "Night's Cavalry only spawns on the roads at night and is an optional early fight against a mounted enemy. It is mostly a loot and rune opportunity; if it is giving you trouble, rest until day and come back later."], ["Leave the Tree Sentinel", "The Tree Sentinel is a golden knight on a horse guarding the road near The First Step. It is the game's first 'you are not ready' marker: hit hard, tanky and fast. Come back with Torrent, some levels and a stronger weapon and it becomes a fair, rewarding fight rather than a wall."], ["Take on Kenneth", "Kenneth Haight is Limgrave's rightful heir who asks you to clear Fort Haight of bandits. The chest at the top holds the left half of the Dectus Medallion, one of two halves that together power the Grand Lift of Dectus, the lift that carries you up from Liurnia to Altus. The right half is far away in Fort Faroth in Dragonbarrow, so picking up this one early costs nothing and saves a trip. Kenneth also returns at the very end of Nepheli's quest, which makes this a small early thread you'll want later."], ["Pick up the Flask", "The Flask of Wondrous Physick is a second, customizable flask. You fill it with Crystal Tears (found all over the map), each of which gives a temporary effect when you drink it. Every Crystal Tear you find later is useless without this flask, so grabbing it now means every tear you pick up is immediately usable. The route flags it as important for exactly this reason."], ["Collect the first Golden Seeds", "Golden Seeds are upgrade items for your Crimson Flask: you spend them at a Site of Grace for more charges. Sacred Tears do the same for how much each charge heals, at Churches of Marika. Both are free power with no stat cost, and since the flask is how you survive long bosses, collecting them as you pass is some of the cheapest strength in the game."], ["Trigger Blaidd", "Blaidd is the half-wolf mercenary working for Ranni. You make him appear by asking Kalé about the wolf howl, learning Finger Snap and using it below him. He tells you he's searching for Darriwil and becomes one of your allies against Radahn, while his thread continues into Ranni's questline."], ["Beat the Tibia Mariner", "Defeating the Tibia Mariner at Summonwater Village starts the Deathroot questline: you report back to D at Roundtable Hold, which later lets you meet Gurranq at the Bestial Sanctum. Gurranq rewards the Deathroot you bring him with powerful spells and items."], ["Stay away from the Rune Bears", "Runebears in this area are tougher than they look for your level. They are optional, give mediocre rewards, and can be looted around rather than fought."], ["Climb Stormhill and defeat Margit", "Margit blocks the road into Stormveil. Beating him is also what lets Melina take you to Roundtable Hold, the hub where almost every NPC questline in the game branches. Margit is your first real check on whether your build, flask and spirit ashes are working."], ["At Roundtable Hold", "Roundtable Hold is the hub where NPCs gather: Hewg for weapon upgrades, Enia the Finger Reader (who checks your Great Runes before Leyndell will let you in), the Twin Maiden Husks, Roderika and later Rogier. Talk to everyone after every major boss because quests there advance silently and some close for good if you wait too long."]], "weeping": [["Get the Royal House Scroll", "These Weeping Peninsula stops are small side events: the Royal House Scroll is a quest item, Blaidd's fight with Darriwil advances his thread, and Oridys's Rise gives a Memory Stone, which adds a spell slot. They are optional but cheap, and they come before you commit to Stormveil."], ["Defeat the Erdtree Avatar", "The Erdtree Avatar guards a Minor Erdtree on the peninsula. It is optional and drops resources; beating it makes this area safer to explore."], ["Clear Castle Morne", "Castle Morne is the peninsula's legacy-style area guarded by the Leonine Misbegotten. The castle is also where Irina and Edgar's questline plays out, so clearing it lets you progress that thread."], ["Advance Irina", "Irina's quest is a sad, short questline about delivering a letter. Its final reward is a +8 weapon, which jumps your weapon level well above where you probably are. If you finish too early your online matchmaking is based on that higher level, which can pair you with tougher players, so the route says to hold the last step until your weapon is around +8."]], "stormveil": [["Fight through the castle", "Stormveil Castle is the first legacy dungeon: a connected castle with shortcuts and elevators. It also hands out Stonesword Keys, consumables that open imp statues for extra loot around the world, so they feed into later areas."], ["Find Rogier", "Rogier is a sorcerer who starts in the castle's chapel before Godrick and moves to Roundtable Hold afterward. He gives items and is the first step of the Black Knifeprint line that you finish later in Liurnia, so meeting him here keeps that line open."], ["Summon Nepheli", "Nepheli Loux is a warrior you can summon to help against Godrick. Meeting her here starts her questline, which ends much later: after Morgott, in the Stormveil throne room, where Kenneth Haight names her ruler of Limgrave."], ["Defeat Godrick", "Godrick is the first Shardbearer. His Great Rune is one of the seven; any two let Enia open the way into Leyndell. Beating him also opens the road into Liurnia and gives you the first real boss victory that matters to the main story."], ["Restore Godrick", "A Great Rune must be restored at a Divine Tower before it can be used. Godrick's tower is the Divine Tower of Limgrave on Stormhill. Skipping it means the rune does nothing when you equip it, so do it while you are close."]], "liurnia": [["Work through Thops", "Liurnia South is a collection of small quests: Thops (a sorcerer outside the academy), Rya (a scout), Latenna and the Malefactor's Evergaol. They set up Academy access, an early Volcano Manor route and some story items, and they are the quest threads you finish later."], ["Help Rya", "Rya the Scout asks you to retrieve her necklace and then gives you an invitation to Volcano Manor. It is an early way into Mt. Gelmir's story, which otherwise sits much later in the route."], ["Take the Academy Glintstone Key", "The Glintstone Key is the physical key that opens the gate of Raya Lucaria Academy. There are two in the game; one is outside near the Glintstone Dragon Smarag, and one is inside the academy. Without it you cannot proceed to Rennala."], ["Don't move Blackguard", "Blackguard Big Boggart is a merchant and a quest character. If you push his quest forward early he stops being a merchant, so the route warns you to leave him until you are done with what he sells."], ["Clear the academy", "Raya Lucaria Academy is a legacy dungeon whose goal is Rennala. Along the way you meet the Red Wolf of Radagon and Moongrum, and the iron ball trap, and you finish the dungeon by taking the main elevator."], ["Buy what you want from Thops", "Thops sells sorceries directly only until you give him the Academy Key. After that his shop closes, so buy first. He then goes into the academy and the key is how his quest progresses."], ["Defeat Rennala", "Rennala is the Shardbearer who leads the academy. Her Great Rune of the Unborn is one of the seven, and beating her unlocks the full-moon respec, so you can fix your build before the long climb ahead."], ["Hyetta's grape", "Liurnia East has Hyetta's grape quest, Jarburg, the Church of Vows and the Black Knife Catacombs. They are linked to the Frenzied Flame, Latenna and Ranni threads. It is the second half of Liurnia and it is where those questlines pick up speed."], ["Give the Black Knifeprint", "The Black Knifeprint is an item you find in the Black Knife Catacombs. Giving it to Rogier unlocks the next stage of his quest, which pays out spells and items."], ["Hit the pot Albus", "Albus the pot is an old Albinauric in the Village of the Albinaurics. Hitting him gives you the right half of the Haligtree Secret Medallion. You need both halves to open the Consecrated Snowfield much later, and getting this one now avoids a trip back."], ["Visit the Four Belfries", "The Four Belfries lead toward Caria Manor, where Royal Knight Loretta guards the way up to Ranni's Rise. Beating Loretta is what lets you finally meet Ranni at her tower."], ["Meet Ranni", "Ranni's Rise is where Ranni accepts you as her servant, which starts the main thread of her quest. The path forks here: Seluvis, her puppeteer, offers a betrayal route that fails her quest. The route recommends staying loyal."], ["Follow Sellen", "Sorceress Sellen teaches sorceries and connects you to the Radahn festival, since she tells you that defeating Radahn will free the stars."], ["Loot the Cursemark", "The Divine Tower of Liurnia holds the Cursemark of Death, which Fia's questline needs later to progress. The tower has an attacker, Preceptor Miriam, who appears the moment you enter the secret area."], ["After Radahn, fetch", "Once Radahn is dead, the crater in Limgrave opens the way into Nokron. The Fingerslayer Blade is in there, and Ranni cannot continue without it, so it is a hard gate in her quest."]], "ainsel": [["Collect smithing stones", "Ainsel River is the underground area that shortcuts toward Ranni's questline. It is dense with smithing stones for upgrading weapons and the Malformed Star at the end is the optional boss."], ["Defeat the Dragonkin Soldier", "The Dragonkin Soldier of Nokstella is the Ainsel River boss; defeating it gives the grace that lets you continue toward Nokstella and Ranni's story."], ["Nokstella and the Lake of Rot", "Nokstella comes much later in the rou
