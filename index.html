<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lands Between Journey</title>
<style>
  :root{
    --bg:#0b0907; --panel:#15110c; --line:#2e2618; --text:#eadfc4; --muted:#8f8368; --gold:#d9b25a;
    --boss:#c9503c; --quest:#d9b25a; --item:#6aa6d6; --ok:#79b568;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden}
  button{background:none;color:var(--text);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}

  /* top bar */
  #top{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  #top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
  #prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  #prog .bar{flex:1;max-width:340px;height:6px;background:#000;border-radius:4px;overflow:hidden}
  #prog .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  #otext{color:var(--muted);font-size:13px;white-space:nowrap}
  #search{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font:inherit;width:200px}
  #menu{display:flex;gap:6px}

  /* map */
  #main{flex:1;position:relative;min-height:0}
  #vp{position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;cursor:grab}
  #vp.drag{cursor:grabbing}
  #vp.placing{cursor:crosshair}
  #world{position:absolute;left:0;top:0;width:1920px;height:1827px;transform-origin:0 0;overflow:hidden}
  #world.anim{transition:transform .5s ease}
  #world img{position:absolute;left:0;top:0;width:1920px;height:1827px;display:block;user-select:none;-webkit-user-drag:none}
  #mapimg{filter:grayscale(1) brightness(1.02) contrast(1.05)}
  #mapcolor{filter:saturate(1.15) brightness(.95);clip-path:polygon(0 0,0 0,0 0);pointer-events:none}
  #zsvg{position:absolute;left:0;top:0;width:1920px;height:1827px}
  .z{fill:transparent;stroke:#000;stroke-opacity:.35;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
  .z:hover{fill:#ffffff22;stroke-opacity:.7}
  .z.sel{stroke-opacity:1;stroke-width:3.5;fill:transparent}
  #shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,#0008 100%);pointer-events:none}

  .bd{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));cursor:pointer;user-select:none;touch-action:none;pointer-events:none}
  .bd .pill{display:flex;align-items:center;gap:6px;background:#0f0c08e8;border:1.5px solid var(--hue,var(--gold));border-radius:999px;padding:2px 10px 2px 3px;pointer-events:auto;white-space:nowrap;box-shadow:0 2px 8px #000c}
  .bd .ring{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
      background:conic-gradient(var(--hue,var(--gold)) calc(var(--p)*1%), #ffffff2a 0)}
  .bd .ring b{width:20px;height:20px;border-radius:50%;background:#0f0c08;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .bd .nm{font-size:11.5px;font-weight:700;color:#fff}
  .bd .lv{font-size:10.5px;font-weight:700;color:var(--hue,var(--gold))}
  .bd:hover .pill{background:#241c10}
  .moving .bd{pointer-events:auto}
  .bd.full .ring{background:var(--ok)}
  .bd.full .ring b{color:var(--ok)}
  .bd.dim{opacity:.3}
  .bd.sel .ring{box-shadow:0 0 0 3px #fff,0 2px 8px #000c}
  .moving .bd{outline:1px dashed var(--gold);outline-offset:4px;cursor:move}

  .dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;
      border:2px solid #fff;transform:scale(var(--inv,1));cursor:pointer;box-shadow:0 1px 4px #000}
  .dot.boss{background:var(--boss)} .dot.quest{background:#a8802f} .dot.item{background:#3f77ab}
  .dot.found{background:#3f6a35;opacity:.6}
  .dot.sel{box-shadow:0 0 0 3px var(--gold)}
  .dot{width:14px;height:14px;margin:-7px 0 0 -7px;font-size:8px;border-width:1.5px}
  .dot.big{width:20px;height:20px;margin:-10px 0 0 -10px;font-size:11px;border-width:2px}
  .dot.approx{border-style:dashed}
  .dot.hl{z-index:6;transform:scale(calc(var(--inv,1)*1.9));border:2px solid #fff;animation:pulse 1.3s ease-out infinite}
  .has-hl .dot:not(.hl){opacity:.3}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #d9b25aff,0 0 0 3px #fff}100%{box-shadow:0 0 0 22px #d9b25a00,0 0 0 3px #fff}}
  .it.hl{background:#2a2112;box-shadow:inset 3px 0 0 var(--gold)}

  .zoom{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoom button{width:34px;height:34px;padding:0;font-size:18px;background:#15110ccc}
  #banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;background:var(--gold);color:#1b1408;padding:7px 16px;border-radius:999px;display:none;font-weight:600;max-width:90%;text-align:center}
  #nomap{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--muted);z-index:4;background:var(--bg)}

  /* journey strip */
  #journey{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:linear-gradient(transparent,#0b0907f0 40%)}
  .jc{flex:none;border:1px solid var(--line);border-radius:10px;padding:6px 11px;background:#15110cee;cursor:pointer;min-width:118px}
  .jc:hover{border-color:var(--gold)}
  .jc.sel{border-color:var(--gold)}
  .jc small{display:block;color:var(--muted);font-size:11.5px}
  .jc .jb{height:3px;background:#000;border-radius:2px;margin-top:5px;overflow:hidden}
  .jc .jb i{display:block;height:100%;background:var(--gold)}
  .jc.full .jb i{background:var(--ok)}

  /* detail */
  #detail{position:absolute;right:0;top:0;bottom:0;width:390px;max-width:100%;z-index:7;background:var(--panel);border-left:1px solid var(--line);
      transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
  #detail.open{transform:none}
  #dh{padding:16px 18px 10px;border-bottom:1px solid var(--line);position:relative}
  #dh h2{margin:0;font-size:20px;color:var(--gold);font-weight:600;padding-right:26px}
  #dh .sub{color:var(--muted);font-size:13px}
  #dh .bar{height:5px;background:#000;border-radius:3px;overflow:hidden;margin:10px 0 8px}
  #dh .bar i{display:block;height:100%;background:var(--gold)}
  #dx{position:absolute;right:12px;top:12px;border:0;font-size:20px;padding:0 6px;line-height:1}
  #fl{display:flex;gap:6px;flex-wrap:wrap}
  #tabs{display:flex;gap:6px;margin:10px 0 8px}
  #tabs button.on{border-color:var(--gold);color:var(--gold)}
  .gh{padding:12px 18px 4px;color:var(--gold);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
  .gstep{display:flex;gap:10px;align-items:flex-start;padding:8px 18px;border-bottom:1px solid #211a10;border-left:3px solid transparent}
  .gstep input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
  .gstep .gt{flex:1;cursor:default}
  .gw{display:block;margin-top:5px;font-size:13px;line-height:1.5;color:#b8ab8c}
  .gw b{color:var(--gold);font-weight:600}
  .gstep.linked .gt{cursor:pointer}
  .gstep.done{background:#142014;border-left-color:var(--ok)}
  .gstep.done .gt{color:#9fcf92}
  .gstep.hl{background:#2a2112;border-left-color:var(--gold)}
  .it.done{background:#142014;box-shadow:inset 3px 0 0 var(--ok)}
  #rn{margin-top:10px;font-size:12.5px;color:#cfc3a4}
  #rn summary{cursor:pointer;color:var(--gold);list-style:none}
  #rn div{margin-top:6px;line-height:1.45}
  #di{overflow:auto;flex:1;padding:6px 0 90px}
  .warn{margin:10px 18px 0;padding:8px 11px;border:1px solid var(--boss);border-radius:8px;color:#f0c8bf;background:#2a1511;font-size:12.5px}
  .it{padding:9px 18px;border-bottom:1px solid #211a10}
  .ih{display:flex;gap:10px;align-items:flex-start}
  .ih input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
  .ih .t{flex:1;cursor:pointer}
  .it.done .t{color:var(--muted);text-decoration:line-through}
  .gl{display:inline-block;width:17px;text-align:center}
  .gl.boss{color:var(--boss)} .gl.quest{color:var(--quest)} .gl.item{color:var(--item)}
  .ib{margin:6px 0 2px 26px;font-size:13px;color:#cfc3a4}
  .ib b{color:var(--gold)}
  .ib em,.ib .note{color:var(--muted);font-size:12.5px}
  .ib .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .ib .act button,.ib .act a{font-size:12px;padding:3px 10px}
  .ib a{color:var(--item);border:1px solid var(--line);border-radius:999px;text-decoration:none}
  .pinned{color:var(--ok);font-size:11px}

  @media(max-width:1000px){
    #top{flex-wrap:wrap;gap:8px 12px}
    #menu{margin-left:auto}
    #prog{order:5;flex:1 1 100%}
    #prog .bar{max-width:none}
    #search{order:4;flex:1;width:auto;min-width:120px}
  }
  @media(max-width:800px){
    #top{padding:8px 12px}
    #detail{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
    #detail.open{transform:none}
    #journey{padding-bottom:6px}
  }
</style>
</head>

  <div id="prog"><div class="bar"><i id="obar"></i></div><span id="otext"></span></div>
  <input id="search" type="search" placeholder="Search...">
  <div id="menu">
    <button id="mv" title="Drag region badges to the right spot on the map">Move badges</button>
    <button id="exp">Export</button><button id="imp">Import</button><button id="reset">Reset</button>
  </div>
</header>

    <div id="di"></div>
  </aside>
</section>

function match(o){
  if (!search) return true;
  const hay=(o.it.x+" "+(o.it.n||"")+" "+whereParts(o.it).txt+" "+o.r.name).toLowerCase();
  return hay.includes(search);
}
function counts(list){ const d=list.filter(o=>done[o.id]).length; return {d,t:list.length}; }
const regionItems = r => ALL.filter(o=>o.r===r);

// ---------- pan / zoom ----------
const vp=$("vp"), world=$("world");
let S=1, TX=0, TY=0, fitS=1;
function apply(anim){
  world.classList.toggle("anim",!!anim);
  world.style.transform=`translate(${TX}px,${TY}px) scale(${S})`;
  world.style.setProperty("--inv",(1/Math.max(S,.0001)).toFixed(4));
  drawDots();
}
function fit(anim){
  const w=vp.clientWidth, h=vp.clientHeight;
  fitS=Math.min(w/MAPW,h/MAPH); S=fitS; TX=(w-MAPW*S)/2; TY=(h-MAPH*S)/2; apply(anim);
}
function zoomAt(cx,cy,f,anim){
  const s2=Math.max(fitS*.9,Math.min(5,S*f));
  TX=cx-(cx-TX)*s2/S; TY=cy-(cy-TY)*s2/S; S=s2; apply(anim);
}
const isMobile = ()=>window.matchMedia("(max-width:800px)").matches;
function centerOn(px,py,scale){
  const w=vp.clientWidth, h=vp.clientHeight;
  let cx=w/2, cy=h/2;
  if ($("detail").classList.contains("open")){
    if (isMobile()){ cy=h*0.19; } else { cx=(w-Math.min(390,w))/2; }
  }
  S=Math.min(5,scale);
  TX=cx-(px/100*MAPW)*S; TY=cy-(py/100*IMGH)*S; apply(true);
}
vp.addEventListener("wheel",e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015)); },{passive:false});
$("zin").onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.4,true);
$("zout").onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.4,true);
$("zfit").onclick=()=>fit(true);
window.addEventListener("resize",()=>{ const was=S<=fitS*1.001; fitS=Math.min(vp.clientWidth/MAPW,vp.clientHeight/MAPH); if(was) fit(); });

const ptrs=new Map(); let lastDist=0, moved=0, dragBd=null;
vp.addEventListener("pointerdown",e=>{
  moved=0;
  const bd=e.target.closest(".bd");
  if (bd && moving){ dragBd=bd; bd.setPointerCapture(e.pointerId); e.preventDefault(); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y); }
});
vp.addEventListener("pointermove",e=>{
  if (dragBd){
    const r=vp.getBoundingClientRect();
    const x=Math.max(0,Math.min(100,((e.clientX-r.left-TX)/S)/MAPW*100)), y=Math.max(0,Math.min(100,((e.clientY-r.top-TY)/S)/IMGH*100));
    bpos[dragBd.dataset.id]=[+x.toFixed(2),+y.toFixed(2)];
    dragBd.style.left=(x/100*MAPW)+"px"; dragBd.style.top=(y/100*IMGH)+"px"; moved=99; return;
  }
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if (ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if (moved>4){ if(!vp.classList.contains("drag")) try{vp.setPointerCapture(e.pointerId);}catch(_){} vp.classList.add("drag"); TX+=dx; TY+=dy; apply(); }
  } else if (ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), r=vp.getBoundingClientRect();
    if(lastDist) zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/lastDist);
    lastDist=d; moved=99;
  }
});
function endPtr(e){ if(dragBd){dragBd=null;saveB();return;} ptrs.delete(e.pointerId); lastDist=0; vp.classList.remove("drag"); }
vp.addEventListener("pointerup",endPtr); vp.addEventListener("pointercancel",endPtr);

// placing a pin
vp.addEventListener("click",e=>{
  if (!placing || moved>4) return;
  const r=vp.getBoundingClientRect();
  const x=((e.clientX-r.left-TX)/S)/MAPW*100, y=((e.clientY-r.top-TY)/S)/IMGH*100;
  ipos[placing]=[+x.toFixed(2),+y.toFixed(2)]; saveI(); stopPlacing(); drawDetail(); drawDots();
});
function startPlacing(id){
  placing=id; vp.classList.add("placing");
  $("banner").style.display="block"; $("banner").textContent="Click the map to pin: "+byId[id].it.x+"  (Esc to cancel)";
}
function stopPlacing(){ placing=null; vp.classList.remove("placing"); $("banner").style.display="none"; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(placing) stopPlacing(); else closeDetail(); } });

function drawBadges(){
  const L=$("bds"); L.innerHTML="";
  R.forEach(r=>{
    const p=bposOf(r); if(!p) return;
    const c=counts(regionItems(r)), pct=c.t?Math.round(c.d/c.t*100):0;
    const el=document.createElement("div");
    el.className="bd"+(pct===100?" full":"")+(selR===r?" sel":"")+(search&&!regionItems(r).some(match)?" dim":"");
    el.dataset.id=r.id; el.style.setProperty("--p",pct); el.style.setProperty("--hue",hueOf(r));
    el.style.left=(p[0]/100*MAPW)+"px"; el.style.top=(p[1]/100*IMGH)+"px";
    el.innerHTML=`<div class="pill"><div class="ring"><b>${pct===100?"✓":r.n}</b></div><span class="nm">${UNDER.has(r.id)?"↓ ":""}${esc(SHORT[r.id]||r.name)}</span><span class="lv">Lv ${esc(r.lvl)}</span></div>`;
    el.onclick=()=>{ if(placing||moved>4) return; select(r); };
    L.appendChild(el);
  });
}
// zone outlines (clickable) + color reveal of the selected zone
function drawZones(){
  const svg=$("zsvg"); svg.innerHTML="";
  const NSV="http://www.w3.org/2000/svg";
  R.forEach(r=>{
    const pts=ZONES[r.id]; if(!pts) return;
    const poly=document.createElementNS(NSV,"polygon");
    poly.setAttribute("points",pts.map(p=>p.join(",")).join(" "));
    poly.setAttribute("class","z"+(selR===r?" sel":""));
    if (selR===r){ poly.style.stroke=hueOf(r); poly.style.fill=hueOf(r)+"14"; }
    poly.addEventListener("click",()=>{ if(placing){ return; } if(moved>4) return; select(r); });
    svg.appendChild(poly);
  });
  const col=$("mapcolor");
  const pts = selR && ZONES[selR.id];
  col.style.clipPath = pts ? "polygon("+pts.map(p=>p[0]+"px "+p[1]+"px").join(",")+")" : "polygon(0 0,0 0,0 0)";
}

function dotPos(o){
  if (ipos[o.id]) return {pts:[ipos[o.id]], kind:"set"};
  const l = LOC[o.it.x];
  return l && l.length ? {pts:l, kind:"data"} : null;
}
function ptsBox(pts){
  const xs=pts.map(p=>p[0]/100*MAPW), ys=pts.map(p=>p[1]/100*IMGH);
  return {x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)};
}
function focusPts(pts){
  const bx=ptsBox(pts), w=vp.clientWidth, h=vp.clientHeight;
  let cx=w/2, cy=h/2;
  if ($("detail").classList.contains("open")){ if(isMobile()){ cy=h*0.19; } else { cx=(w-Math.min(390,w))/2; } }
  const bw=Math.max(bx.x1-bx.x0,80), bh=Math.max(bx.y1-bx.y0,80);
  const kx=(cx*1.6)/bw, ky=(cy*1.6)/bh;
  S=Math.max(fitS*1.3, Math.min(5, fitS*2.6, kx, ky));
  TX=cx-((bx.x0+bx.x1)/2)*S; TY=cy-((bx.y0+bx.y1)/2)*S; apply(true);
}
function drawDots(){
  const L=$("dots"); L.innerHTML="";
  L.classList.toggle("has-hl", !!selItem);
  ALL.forEach(o=>{
    if (selR!==o.r) return;                                // pins only for the selected zone
    const dp=dotPos(o); if(!dp) return;
    if (filterT!=="all" && o.it.t!==filterT) return;
    if (!match(o)) return;
    dp.pts.forEach(p=>{
      const el=document.createElement("div");
      el.className="dot big "+o.it.t+(done[o.id]?" found":"")+(selItem===o.id?" hl":"");
      el.textContent=done[o.id]?"\u2713":GL[o.it.t];
      el.style.left=(p[0]/100*MAPW)+"px"; el.style.top=(p[1]/100*IMGH)+"px";
      el.title=o.it.x;
      el.onclick=ev=>{ if(placing||moved>4) return; ev.stopPropagation(); selItem=o.id; openIt.add(o.id); drawDetail(); drawDots(); const row=document.querySelector(`[data-it="${CSS.escape(o.id)}"]`); if(row) row.scrollIntoView({block:"center"}); };
      L.appendChild(el);
    });
  });
}

 "Grab Capital loot before ashening: Bolt of Gransax, Golden Order Principia, Erdtree Bow, Celestial Dew"], ["Pick up the Seedbed Curses.", "Seedbed Curses (3 spots)"], ["Solve the Goldmask / Corhyn riddle before the Erdtree burns.", "Goldmask + Brother Corhyn questline"], ["Nepheli's quest ends after Morgott in the Stormveil throne room.", "Nepheli Loux: crown her ruler of Limgrave"], ["Boc has a choice here: the Larval Tear moves him to the Academy.", null], ["Gideon is fought later, in the Ashen Capital.", "Sir Gideon Ofnir (Ashen Capital)"]], "mountaintops": ["# Forbidden Lands & Mountaintops · Lv 90+", ["Melina gives the Rold Medallion after Morgott; activate the Grand Lift of Rold.", "Rold Medallion (Melina, after Morgott) -> Grand Lift of Rold"], ["Night's Cavalry (night only), Golden Seed, Black Blade Kindred.", null], ["Zamor Ruins, Ancient Snow Valley.", null], ["Defeat Commander Niall at Castle Sol.", "Commander Niall (Castle Sol)"], ["Defeat the Fire Giant.", "Fire Giant"], ["Volcano Manor line: fight Juno Hoslow at Shack of the Lofty, then return to Tanith.", null], ["Three Fingers are down in the Shunning-Grounds: touching them locks the Frenzied Flame ending.", "Three Fingers (meet) — needed for Shabriri summon; frenzy needs Miquella's Needle if not wanted"], ["The Forge of the Giants is the point of no return: finish your quests first.", "Forge of the Giants: do NOT burn the Erdtree until quests are done"]], "snowfield": ["# Consecrated Snowfield · Lv 90+", ["Take the left Secret Medallion from the Castle Sol roof.", "Haligtree Secret Medallion Left: Castle Sol roof, after Niall"], ["Hoist the Secret Medallion at the bottom of the Rold lift.", "Hoist Secret Medallion at bottom of Grand Lift of Rold"], ["Catacombs and caves; Latenna's quest ends at Apostate Derelict.", null], ["Skip Ordina for now (very hard).", "Ordina, Liturgical Town"], ["Millicent continues in Elphael.", "Millicent: final steps in Elphael"]], "mohgwyn": ["# Mohgwyn Palace · Lv 100+", ["Varre's questline gives the Pureblood Knight's Medal. Don't use it early.", "Varre / Pureblood Knight's Medal"], ["Map, key items, upgrade materials, Mausoleum caves.", null], ["Defeat Mohg, Lord of Blood.", "Mohg, Lord of Blood"]], "haligtree": ["# Miquella's Haligtree · Lv 120+", ["Canopy, Haligtree Town, then Elphael.", null], ["Defeat Loretta.", "Loretta, Knight of the Haligtree"], ["Millicent's finale (assist or betray, rewards change).", "Millicent finale (verify steps on wiki)"], ["Defeat Malenia.", "Malenia, Blade of Miquella"], ["Claim Gideon's Roundtable rewards (or buy them from the Twin Maiden Husks).", "Gideon rewards need: Mohgwyn found, Haligtree found, Mohg + Malenia dead"]], "farum": ["# Crumbling Farum Azula · Lv 120+", ["Dragon Temple and rooftops.", null], ["Defeat the Godskin Duo.", "Godskin Duo"], ["Optional: Dragonlord Placidusax (Miquella's Needle works here).", "Dragonlord Placidusax"], ["Finish all Royal Capital NPC quests and items first, then fight the Beast Clergyman.", "Beast Clergyman (Maliketh)"], ["Defeat Maliketh. The world changes permanently until NG+.", "Maliketh, the Black Blade"]], "ashen": ["# Leyndell, Ashen Capital · Lv 150+", ["Finish the Corhyn / Goldmask questline.", null], ["Beat Hoarah Loux.", "Godfrey / Hoarah Loux"], ["Beat Radagon.", "Radagon of the Golden Order"], ["Beat the Elden Beast.", "Elden Beast"], ["Pick an ending (default: interact with Fractured Marika and Mend the Elden Ring).", "Choose ending / start NG+"], "# Subterranean Shunning-Grounds · Lv 150+", ["Defeat Esgar, Priest of Blood.", "Esgar, Priest of Blood (Shunning-Grounds)"], ["Defeat Mohg, the Omen.", "Mohg, the Omen (Shunning-Grounds)"], ["Finish Hyetta's quest.", "Hyetta (Lightseeker) quest"]], "dlc": ["# Shadow of the Erdtree · Lv 120+", ["Beat Radahn and Mohg, then enter Miquella's cocoon.", "Unlock: beat Radahn + Mohg, enter Miquella's cocoon"], ["Gather Scadutree Fragments and spend them at a grace.", "Collect Scadutree Fragments (blessing level)"], ["Gather Revered Spirit Ash.", "Collect Revered Spirit Ash"], ["Belurat: Divine Beast Dancing Lion.", "Divine Beast Dancing Lion"], ["Castle Ensis: Rellana.", "Rellana, Twin Moon Knight"], ["Shadow Keep: Messmer.", "Messmer the Impaler"], ["Enir-Ilim: Promised Consort Radahn.", "Promised Consort Radahn"]]};
const WHY = {"limgrave": [["Grab the map", "Maps only show an area once you pick up that region's map fragment, so until you do, graces and dungeons around you stay invisible. The Whetstone Knife is the tool that lets you change Ashes of War on a weapon, which is how you give your first real weapon an identity before Stormveil."], ["Talk to Melina", "Melina is the NPC who follows you all game. You cannot level up at a grace until you accept her as your maiden, so this is the real start of the game. She later gives you the Rold Medallion after Morgott and is the one who asks at the Forge of the Giants whether you will commit to burning the Erdtree. Torrent is the gift she gives for accepting."], ["Visit Church of Elleh", "Renna appears here at night once you have Torrent. She is actually Ranni in disguise, and this meeting starts Ranni's questline, the longest in the game and the one that opens the Age of the Stars ending. She hands you the Spirit Calling Bell and Lone Wolf Ashes, your first spirit summon, which makes Margit and Godrick much easier. If you miss her, the Twin Maiden Husks at Roundtable Hold sell both."], ["Break Boc", "Boc is a tiny seamster who was cursed into a tree. Freeing him starts a quest that follows you across the world: he turns up again in Altus and in Leyndell, and the Larval Tear choice you make with him in Leyndell decides where he ends up. Missing him early is not fatal, but the quest rewards come from meeting him in order."], ["Clear Murkwater Cave", "Patches is a thief who returns all game. Beating him at half health and accepting his surrender makes him a merchant, and that is what lets him show up later at Scenic Isle, Mt. Gelmir, Volcano Manor, the Shaded Castle and finally back at Murkwater Cave. Killing him instead cuts all of that off. His trap chest also teleports you near Mistwood, which is the start of the next area."], ["Meet Roderika", "Roderika is the Heartbroken Maiden at Stormhill Shack who becomes the Spirit Tuner. After you deliver her message in Stormveil and bring back the Chrysalids' Memento she moves to Roundtable Hold, gives you a Golden Seed and lets you upgrade spirit ashes there. Spirit ashes are one of the best ways to survive the next ten bosses, so this unlocks real strength, not just a quest tick."], ["Night's Cavalry", "Night's Cavalry only spawns on the roads at night and is an optional early fight against a mounted enemy. It is mostly a loot and rune opportunity; if it is giving you trouble, rest until day and come back later."], ["Leave the Tree Sentinel", "The Tree Sentinel is a golden knight on a horse guarding the road near The First Step. It is the game's first 'you are not ready' marker: hit hard, tanky and fast. Come back with Torrent, some levels and a stronger weapon and it becomes a fair, rewarding fight rather than a wall."], ["Take on Kenneth", "Kenneth Haight is Limgrave's rightful heir who asks you to clear Fort Haight of bandits. The chest at the top holds the left half of the Dectus Medallion, one of two halves that together power the Grand Lift of Dectus, the lift that carries you up from Liurnia to Altus. The right half is far away in Fort Faroth in Dragonbarrow, so picking up this one early costs nothing and saves a trip. Kenneth also returns at the very end of Nepheli's quest, which makes this a small early thread you'll want later."], ["Pick up the Flask", "The Flask of Wondrous Physick is a second, customizable flask. You fill it with Crystal Tears (found all over the map), each of which gives a temporary effect when you drink it. Every Crystal Tear you find later is useless without this flask, so grabbing it now means every tear you pick up is immediately usable. The route flags it as important for exactly this reason."], ["Collect the first Golden Seeds", "Golden Seeds are upgrade items for your Crimson Flask: you spend them at a Site of Grace for more charges. Sacred Tears do the same for how much each charge heals, at Churches of Marika. Both are free power with no stat cost, and since the flask is how you survive long bosses, collecting them as you pass is some of the cheapest strength in the game."], ["Trigger Blaidd", "Blaidd is the half-wolf mercenary working for Ranni. You make him appear by asking Kalé about the wolf howl, learning Finger Snap and using it below him. He tells you he's searching for Darriwil and becomes one of your allies against Radahn, while his thread continues into Ranni's questline."], ["Beat the Tibia Mariner", "Defeating the Tibia Mariner at Summonwater Village starts the Deathroot questline: you report back to D at Roundtable Hold, which later lets you meet Gurranq at the Bestial Sanctum. Gurranq rewards the Deathroot you bring him with powerful spells and items."], ["Stay away from the Rune Bears", "Runebears in this area are tougher than they look for your level. They are optional, give mediocre rewards, and can be looted around rather than fought."], ["Climb Stormhill and defeat Margit", "Margit blocks the road into Stormveil. Beating him is also what lets Melina take you to Roundtable Hold, the hub where almost every NPC questline in the game branches. Margit is your first real check on whether your build, flask and spirit ashes are working."], ["At Roundtable Hold", "Roundtable Hold is the hub where NPCs gather: Hewg for weapon upgrades, Enia the Finger Reader (who checks your Great Runes before Leyndell will let you in), the Twin Maiden Husks, Roderika and later Rogier. Talk to everyone after every major boss because quests there advance silently and some close for good if you wait too long."]], "weeping": [["Get the Royal House Scroll", "These Weeping Peninsula stops are small side events: the Royal House Scroll is a quest item, Blaidd's fight with Darriwil advances his thread, and Oridys's Rise gives a Memory Stone, which adds a spell slot. They are optional but cheap, and they come before you commit to Stormveil."], ["Defeat the Erdtree Avatar", "The Erdtree Avatar guards a Minor Erdtree on the peninsula. It is optional and drops resources; beating it makes this area safer to explore."], ["Clear Castle Morne", "Castle Morne is the peninsula's legacy-style area guarded by the Leonine Misbegotten. The castle is also where Irina and Edgar's questline plays out, so clearing it lets you progress that thread."], ["Advance Irina", "Irina's quest is a sad, short questline about delivering a letter. Its final reward is a +8 weapon, which jumps your weapon level well above where you probably are. If you finish too early your online matchmaking is based on that higher level, which can pair you with tougher players, so the route says to hold the last step until your weapon is around +8."]], "stormveil": [["Fight through the castle", "Stormveil Castle is the first legacy dungeon: a connected castle with shortcuts and elevators. It also hands out Stonesword Keys, consumables that open imp statues for extra loot around the world, so they feed into later areas."], ["Find Rogier", "Rogier is a sorcerer who starts in the castle's chapel before Godrick and moves to Roundtable Hold afterward. He gives items and is the first step of the Black Knifeprint line that you finish later in Liurnia, so meeting him here keeps that line open."], ["Summon Nepheli", "Nepheli Loux is a warrior you can summon to help against Godrick. Meeting her here starts her questline, which ends much later: after Morgott, in the Stormveil throne room, where Kenneth Haight names her ruler of Limgrave."], ["Defeat Godrick", "Godrick is the first Shardbearer. His Great Rune is one of the seven; any two let Enia open the way into Leyndell. Beating him also opens the road into Liurnia and gives you the first real boss victory that matters to the main story."], ["Restore Godrick", "A Great Rune must be restored at a Divine Tower before it can be used. Godrick's tower is the Divine Tower of Limgrave on Stormhill. Skipping it means the rune does nothing when you equip it, so do it while you are close."]], "liurnia": [["Work through Thops", "Liurnia South is a collection of small quests: Thops (a sorcerer outside the academy), Rya (a scout), Latenna and the Malefactor's Evergaol. They set up Academy access, an early Volcano Manor route and some story items, and they are the quest threads you finish later."], ["Help Rya", "Rya the Scout asks you to retrieve her necklace and then gives you an invitation to Volcano Manor. It is an early way into Mt. Gelmir's story, which otherwise sits much later in the route."], ["Take the Academy Glintstone Key", "The Glintstone Key is the physical key that opens the gate of Raya Lucaria Academy. There are two in the game; one is outside near the Glintstone Dragon Smarag, and one is inside the academy. Without it you cannot proceed to Rennala."], ["Don't move Blackguard", "Blackguard Big Boggart is a merchant and a quest character. If you push his quest forward early he stops being a merchant, so the route warns you to leave him until you are done with what he sells."], ["Clear the academy", "Raya Lucaria Academy is a legacy dungeon whose goal is Rennala. Along the way you meet the Red Wolf of Radagon and Moongrum, and the iron ball trap, and you finish the dungeon by taking the main elevator."], ["Buy what you want from Thops", "Thops sells sorceries directly only until you give him the Academy Key. After that his shop closes, so buy first. He then goes into the academy and the key is how his quest progresses."], ["Defeat Rennala", "Rennala is the Shardbearer who leads the academy. Her Great Rune of the Unborn is one of the seven, and beating her unlocks the full-moon respec, so you can fix your build before the long climb ahead."], ["Hyetta's grape", "Liurnia East has Hyetta's grape quest, Jarburg, the Church of Vows and the Black Knife Catacombs. They are linked to the Frenzied Flame, Latenna and Ranni threads. It is the second half of Liurnia and it is where those questlines pick up speed."], ["Give the Black Knifeprint", "The Black Knifeprint is an item you find in the Black Knife Catacombs. Giving it to Rogier unlocks the next stage of his quest, which pays out spells and items."], ["Hit the pot Albus", "Albus the pot is an old Albinauric in the Village of the Albinaurics. Hitting him gives you the right half of the Haligtree Secret Medallion. You need both halves to open the Consecrated Snowfield much later, and getting this one now avoids a trip back."], ["Visit the Four Belfries", "The Four Belfries lead toward Caria Manor, where Royal Knight Loretta guards the way up to Ranni's Rise. Beating Loretta is what lets you finally meet Ranni at her tower."], ["Meet Ranni", "Ranni's Rise is where Ranni accepts you as her servant, which starts the main thread of her quest. The path forks here: Seluvis, her puppeteer, offers a betrayal route that fails her quest. The route recommends staying loyal."], ["Follow Sellen", "Sorceress Sellen teaches sorceries and connects you to the Radahn festival, since she tells you that defeating Radahn will free the stars."], ["Loot the Cursemark", "The Divine Tower of Liurnia holds the Cursemark of Death, which Fia's questline needs later to progress. The tower has an attacker, Preceptor Miriam, who appears the moment you enter the secret area."], ["After Radahn, fetch", "Once Radahn is dead, the crater in Limgrave opens the way into Nokron. The Fingerslayer Blade is in there, and Ranni cannot continue without it, so it is a hard gate in her quest."]], "ainsel": [["Collect smithing stones", "Ainsel River is the underground area that shortcuts toward Ranni's questline. It is dense with smithing stones for upgrading weapons and the Malformed Star at the end is the optional boss."], ["Defeat the Dragonkin Soldier", "The Dragonkin Soldier of Nokstella is the Ainsel River boss; defeating it gives the grace that lets you continue toward Nokstella and Ranni's story."], ["Nokstella and the Lake of Rot", "Nokstella comes much later in the route because the enemies are far above this level. The key beats there are the Baleful Shadow's Discarded Palace Key and the Lake of Rot, where Astel waits."]], "siofra": [["Light the eight pillars", "Siofra River is entered by a lift from the Siofra River Well. Lighting the eight pillars near the stairs to the Hallowhorn Grounds opens the path to the Ancestor Spirit's arena."], ["Defeat the Mimic Tear", "Nokron is the sunken city that only opens once Radahn is beaten. The Mimic Tear is a boss that copies you; it sits behind a mist door."], ["Open the imp-statue chest", "The Mimic Tear Ashes are in a chest in Night's Sacred Ground behind an imp statue door that needs a Stonesword Key. They summon a copy of you and are one of the best spirit ashes in the game."], ["Defeat the Regal", "The Regal Ancestor Spirit is in an arena reached from Nokron. It is the second Ancestor Spirit boss in the underground and is optional if you want to move faster."], ["Beat the Valiant Gargoyles", "The Valiant Gargoyles are in Siofra Aqueduct. The coffin after them is the way into Deeproot Depths, where Fia's questline and Fortissax are."]], "caelid": [["Smoldering Church", "Caelid is a dangerous, rot-filled region that sits next to Limgrave. The sites here are Smoldering Church, Fort Gael, Sellia and the War-Dead Catacombs, which give resources and the Golden Scarab. It is the main way to reach Radahn."], ["Bring immunity gear", "Scarlet Rot is a status that drains health fast and the Abandoned Cave has rot pools. Preserving Boluses and immunity gear let you pass without dying to it."], ["Follow Millicent", "Millicent's quest is one of the longest in the game and crosses Caelid, Altus, the Mountaintops and the Haligtree. It begins with Gowry and the Unalloyed Gold Needle and ends with a choice that changes your rewards, so starting it now keeps you on track."], ["Talk to Alexander", "Alexander and Blaidd both fight beside you against Radahn. Talking to them first sets up that help and moves their questlines along. If the Old Geezer loops, talk to Iji at Caria Manor first."], ["Deathroot", "Gurranq the Beast Clergyman at the Bestial Sanctum gives rewards for Deathroot, which you collect by killing Those Who Live in Death. The Deathroot questline began at Summonwater Village, and the sanctum itself is dangerous this early."], ["Bernahl", "Knight Bernahl lives at the Warmaster's Shack in Stormhill and his quest only truly begins once you pledge to Volcano Manor. He later joins the manor as Recusant Bernahl."]], "deeproot": [["Enter through the coffin", "Deeproot Depths is a sealed-off underground area. The only legitimate way in is the coffin after the Valiant Gargoyle in Siofra Aqueduct."], ["Advance Fia", "Fia, the Deathbed Companion, is a quest character at the Prince of Death's Throne. She needs the Cursemark of Death from the Divine Tower of Liurnia, and her questline feeds directly into one of the endings."], ["Fia's Champions", "Fia's Champions is an optional boss fight. Beating it opens the Prince of Death's Throne grace, but the quest itself can progress without more fighting."], ["Defeat Lichdragon", "Lichdragon Fortissax is the Deeproot Depths boss. It is optional and sits at the end of the area."]], "altus": [["Enter Altus", "Altus Plateau is reached either by the Grand Lift of Dectus (with both medallion halves) or by Ruin-Strewn Precipice. This is the golden-lit region between you and Leyndell."], ["Do the west and east", "Altus has many small sites: Old Altus Tunnel, the Shaded Castle, the Golden Lineage Evergaol and the Second Church of Marika. They give upgrade materials and are where the Mt. Gelmir grace gets unlocked."], ["Meet Boc, Corhyn", "Corhyn and Goldmask are an NPC pair whose questline spans Altus, Leyndell, the Mountaintops and the Ashen Capital. It must be advanced before the Erdtree burns or Corhyn disappears and Goldmask never appears."], ["Capital Outskirts", "The Draconic Tree Sentinel guards the road into Leyndell from the Capital Outskirts, the last stop before the capital."]], "gelmir": [["Fort Laiedd", "Mt. Gelmir is a volcanic area with Fort Laiedd, Gelmir Hero's Grave and a Magma Wyrm. It is the way into Volcano Manor."], ["Join Volcano Manor", "Volcano Manor is the assassin's guild-style questline run by Tanith. You join it, take contracts and eventually fight Rykard."], ["Finish every contract", "Each contract (Istvan, Rileigh, Juno Hoslow) unlocks other NPCs' quests. If you kill Rykard first, those rewards are locked until NG+."], ["Bernahl's side", "Bernahl moves into Volcano Manor and his quest completes alongside the contracts. It links to the Fortified Manor summons."], ["Defeat Rykard", "Rykard is a Shardbearer whose Great Rune also counts toward Leyndell. Only kill him after finishing every Volcano Manor questline."]], "dragonbarrow": [["Loot the right Dectus", "Fort Faroth holds the right half of the Dectus Medallion; with the left half from Fort Haight it powers the Grand Lift of Dectus."], ["Greyoll", "Dragonbarrow is an optional, high-level area. The route recommends level 80 and above, and its loot is a bonus rather than a requirement."]], "leyndell": [["Skip the Tree Sentinel duo", "The Capital Outskirts is the approach to Leyndell. The route lets you run past the Tree Sentinel duo to the Outer Wall Phantom Tree grace, and the Sealed Tunnel is behind an illusory wall."], ["Have two Great Runes", "Enia the Finger Reader at Roundtable Hold checks that you have at least two Great Runes before Leyndell will let you in. Any two from the seven will do."], ["Defeat Godfrey", "Godfrey's golden shade is the first major fight inside Leyndell, near the West Capital Rampart."], ["Defeat Morgott", "Morgott is the Omen King and a Shardbearer. Beating him gives his Great Rune and, after you fail to enter the Erdtree, Melina gives you the Rold Medallion."], ["Grab the capital loot", "Parts of Royal Capital are lost once Maliketh falls and the city turns ashen: the Bolt of Gransax, the Golden Order Principia, the Erdtree Bow and the Celestial Dew. Collect them first."], ["Pick up the Seedbed Curses", "Seedbed Curses are items used for the Dung Eater questline. They are found in specific spots in the capital that are lost later."], ["Solve the Goldmask", "The Goldmask riddle must be solved in Leyndell before the Erdtree burns, otherwise Corhyn vanishes and Goldmask never returns."], ["Nepheli's quest", "Nepheli's questline has its final step in the Stormveil throne room, and it only triggers after Morgott. Several earlier steps must happen in order."], ["Boc has a choice", "Giving Boc the Larval Tear sends him to the Academy; the other option keeps him in the room. It is a permanent choice."], ["Gideon is fought later", "Sir Gideon Ofnir is the All-Knowing; he is fought in the Ashen Capital after Farum Azula, not here."]], "mountaintops": [["Melina gives the Rold", "After you fail to enter the Erdtree, Melina gives you the Rold Medallion. Using it at the Grand Lift of Rold carries you up to the Mountaintops of the Giants."], ["Night's Cavalry", "The Forbidden Lands are the first area past Leyndell. Night's Cavalry only appears at night and there is a Golden Seed and Black Blade Kindred here."], ["Zamor Ruins", "These Mountaintops sites give upgrade materials and are the stepping stones to Castle Sol and the Fire Giant."], ["Defeat Commander Niall", "Commander Niall guards Castle Sol. The tower roof behind him holds the left Haligtree Secret Medallion half."], ["Defeat the Fire Giant", "The Fire Giant stands between you and the Forge of the Giants. Beating him opens the final stretch toward the forge."], ["Volcano Manor line", "Juno Hoslow at Shack of the Lofty is the last Volcano Manor contract, and Tanith should be revisited after."], ["Three Fingers", "The Three Fingers are the entities behind the Frenzied Flame ending. They are in the sewers under Leyndell, and touching them locks you into that ending."], ["The Forge of the Giants", "The Forge is where Melina asks if you will commit the sin of burning the Erdtree. Accepting teleports you to Crumbling Farum Azula. It is the point of no return for many NPC quests, so finish them first."]], "snowfield": [["Take the left Secret", "The Haligtree Secret Medallion has two halves: the left is on the Castle Sol roof and the right is in the Village of the Albinaurics in Liurnia. Both are needed to open the Snowfield."], ["Hoist the Secret Medallion", "At the Grand Lift of Rold you stand at the bottom and switch the action to Hoist Secret Medallion. It does not work from the top."], ["Catacombs and caves", "The Snowfield has catacombs and caves and is where Latenna's quest ends at Apostate Derelict."], ["Skip Ordina", "Ordina, Liturgical Town opens the path to a very hard late dungeon, which the route says to avoid for now."], ["Millicent continues", "Millicent's quest continues into Elphael, at the Prayer Room, past the Putrid Tree Spirit."]], "mohgwyn": [["Varre's questline", "White Mask Varré is the invader who gives you the Pureblood Knight's Medal after three invasions. The medal teleports you to Mohgwyn but the area is dangerous early."], ["Map, key items", "Mohgwyn Palace is an underground area with a Mausoleum and caves, and it is rich in upgrade materials."], ["Defeat Mohg", "Mohg is a Shardbearer whose Great Rune counts toward Leyndell and whose defeat is required for the Shadow of the Erdtree DLC."]], "haligtree": [["Canopy, Haligtree Town", "Miquella's Haligtree is a late, very hard area. The canopy and town lead down to Elphael."], ["Defeat Loretta", "Loretta, Knight of the Haligtree is a boss at the end of the town and an obstacle toward Elphael."], ["Millicent's finale", "Millicent's finale asks whether you help her or betray her; the choice changes your rewards."], ["Defeat Malenia", "Malenia, Blade of Miquella is a Shardbearer and one of the hardest bosses. Her Great Rune and Gideon's Roundtable rewards depend on her."], ["Claim Gideon", "Gideon's rewards require that you discovered Mohgwyn and the Haligtree and defeated Mohg and Malenia. If you miss them, the Twin Maiden Husks sell them."]], "farum": [["Dragon Temple", "Crumbling Farum Azula is a sky-high ruin. The Forge of the Giants teleports you here."], ["Defeat the Godskin Duo", "The Godskin Duo is the boss in the temple, and the Dragon Temple Transept grace is next to it."], ["Optional: Dragonlord", "Dragonlord Placidusax is an optional ancient dragon. The Miquella's Needle can remove the Frenzied Flame here."], ["Finish all Royal Capital", "Maliketh's fight is the point of no return. Finish Leyndell NPC quests and collect items before you start it."], ["Defeat Maliketh", "Killing Maliketh ashens Leyndell and blocks several areas and quests until NG+."]], "ashen": [["Finish the Corhyn", "Corhyn and Goldmask's questline concludes in the Ashen Capital."], ["Beat Hoarah Loux", "Godfrey as Hoarah Loux, Warrior is the next boss in the Elden Throne after Gideon."], ["Beat Radagon", "Radagon of the Golden Order follows Hoarah Loux through the luminous barrier."], ["Beat the Elden Beast", "The Elden Beast follows Radagon at the Elden Throne and is mandatory."], ["Pick an ending", "You pick your ending after the Elden Beast. The default Age of Fracture needs no questlines; others need specific NPC quests done."], ["Defeat Esgar", "Esgar, Priest of Blood is a boss in the Subterranean Shunning-Grounds, the sewers under Leyndell."], ["Defeat Mohg, the Omen", "Mohg, the Omen is a boss in the Shunning-Grounds, separate from Mohg, Lord of Blood."], ["Finish Hyetta", "Hyetta's quest finishes in the Shunning-Grounds."]], "dlc": [["Beat Radahn and Mohg", "The DLC is unlocked by defeating Radahn and Mohg and entering Miquella's cocoon at Mohgwyn Palace."], ["Gather Scadutree", "Scadutree Fragments raise your damage and defense in the Realm of Shadow. There are 50 across the DLC."], ["Gather Revered", "Revered Spirit Ash boosts spirit ashes and Torrent in the DLC."], ["Belurat", "Belurat, Tower Settlement ends with the Divine Beast Dancing Lion."], ["Castle Ensis", "Castle Ensis East Wing ends with Rellana."], ["Shadow Keep", "Messmer waits in the Specimen Storehouse of the Shadow Keep."], ["Enir-Ilim", "Enir-Ilim is the final area and ends with Promised Consort Radahn."]]};
let tab = (function(){ try{ return localStorage.getItem('er-tab')||'list'; }catch(e){ return 'list'; } })();
function drawGuide(r){
  const steps=GUIDE[r.id]||[];
  const warn=(r.id==="mountaintops"||r.id==="farum")?`<div class="warn">Before the Forge of the Giants / Maliketh: finish Ranni, Millicent, Varre, Volcano Manor, Fia, Goldmask and Sellen quests.</div>`:"";
  let html=warn;
  steps.forEach((st,i)=>{
    if(typeof st==="string"){ html+=`<div class="gh">${esc(st.replace(/^# /,""))}</div>`; return; }
    const text=st[0], key=st[1];
    const o=key?ALL.find(x=>x.r===r&&x.it.x===key):null;
    const id=o?o.id:"gs:"+r.id+":"+i, dn=!!done[id];
    const wr=(WHY[r.id]||[]).find(w=>text.startsWith(w[0])); const why=wr?`<span class="gw"><b>Context:</b> ${esc(wr[1])}</span>`:"";
    html+=`<div class="gstep${dn?" done":""}${o?" linked":""}${o&&selItem===o.id?" hl":""}" data-id="${esc(id)}" data-o="${o?esc(o.id):""}"><input type="checkbox" ${dn?"checked":""}><span class="gt">${o?`<span class="gl ${o.it.t}">${GL[o.it.t]}</span> `:""}${esc(text)}${why}</span></div>`;
  });
  html+=`<div class="it"><span class="note">Based on the Fextralife Game Progress Route (credit: Fextralife wiki), summarised in my own words. Steps with an icon are tied to the checklist and tick together; plain steps are guide-only.</span><div class="act" style="margin-top:8px"><a href="https://eldenring.wiki.fextralife.com/Game_Progress_Route" target="_blank" rel="noopener" style="color:var(--item);font-size:12.5px">Open the full wiki route for the original text ↗</a></div></div>`;
  $("di").innerHTML=html;
  $("di").querySelectorAll(".gstep").forEach(row=>{
    const id=row.dataset.id, oid=row.dataset.o;
    row.querySelector("input").onchange=e=>toggle(id,e.target.checked);
    if(oid) row.querySelector(".gt").onclick=()=>{ selItem=oid; drawDots(); drawDetail(); const dp=dotPos(byId[oid]); if(dp) focusPts(dp.pts); };
  });
}
function setTab(t){ tab=t; try{localStorage.setItem('er-tab',t);}catch(e){} drawDetail(); }
// ---------- detail panel ----------
function select(r, zoom=true){
  if (selR!==r) selItem=null;
  selR=r; $("detail").classList.add("open");
  drawBadges(); drawZones(); drawDetail(); drawJourney(); drawDots();
  if (zoom){ const p=bposOf(r); if(p) setTimeout(()=>centerOn(p[0],p[1],Math.max(fitS*2.2,S<fitS*2.2?fitS*2.2:S)),50); }
}
function closeDetail(){ selR=null; selItem=null; $("detail").classList.remove("open"); drawBadges(); drawZones(); drawJourney(); drawDots(); }
$("dx").onclick=closeDetail;

function drawDetail(){
  if(!selR) return;
  const r=selR, all=regionItems(r), c=counts(all), pct=c.t?Math.round(c.d/c.t*100):0;
  $("dt").textContent=r.name;
  $("ds").textContent=`Step ${r.n} · recommended level ${r.lvl} · ${c.d}/${c.t} found`;
  $("db").style.width=pct+"%";
  const rnEl=$("rn"); if(RN[r.id]){ rnEl.style.display=""; rnEl.querySelector("div").textContent=RN[r.id]; } else { rnEl.style.display="none"; }
  $("fl").innerHTML=["all","boss","quest","item"].map(t=>`<button data-f="${t}" class="${filterT===t?"on":""}">${t==="all"?"all":GL[t]+" "+t}</button>`).join("");
  $("fl").querySelectorAll("button").forEach(b=>b.onclick=()=>{ filterT=b.dataset.f; drawDetail(); drawDots(); });
  document.querySelectorAll("#tabs button").forEach(bt=>{ bt.classList.toggle("on",bt.dataset.t===tab); bt.onclick=()=>setTab(bt.dataset.t); });
  if (tab==="guide"){ $("fl").style.display="none"; drawGuide(r); return; }
  $("fl").style.display="";
  const warn=(r.id==="mountaintops"||r.id==="farum")?`<div class="warn">Before the Forge of the Giants / Maliketh: finish Ranni, Millicent, Varre, Volcano Manor, Fia, Goldmask and Sellen quests.</div>`:"";
  const rows=all.filter(o=>(filterT==="all"||o.it.t===filterT)&&match(o)).map(o=>{
    const w=whereParts(o.it), open=openIt.has(o.id), pinned=!!ipos[o.id], dk=(dotPos(o)||{}).kind||"none";
    return `<div class="it${done[o.id]?" done":""}${selItem===o.id?" hl":""}" data-it="${esc(o.id)}">
      <div class="ih"><input type="checkbox" ${done[o.id]?"checked":""}><span class="t"><span class="gl ${o.it.t}">${GL[o.it.t]}</span>${esc(o.it.x)}${dk==="set"?' <span class="pinned">\u25CF pinned by you</span>':(dk==="data"?' <span class="pinned">\u25CF on map</span>':' <span class="pinned" style="color:var(--muted)">no map pin</span>')}</span></div>
      ${open?`<div class="ib">${o.it.n?`<div class="note">${esc(o.it.n)}</div>`:""}
        ${w.txt?`<div><b>Where:</b> ${esc(w.txt)}${w.unv?" <em>(not wiki-checked)</em>":""}</div>`:`<div><em>Location text not added yet.</em></div>`}
        <div class="act"><button data-a="pin">${pinned?"Re-pin on map":"Pin on map"}</button>${pinned?'<button data-a="unpin">Remove pin</button>':""}<a href="${q(o.it.x)}" target="_blank" rel="noopener">search</a></div></div>`:""}
    </div>`;
  }).join("");
  $("di").innerHTML=warn+(rows||`<div class="it"><em class="note">Nothing here for this filter.</em></div>`);
  $("di").querySelectorAll(".it[data-it]").forEach(row=>{
    const id=row.dataset.it, o=byId[id];
    row.querySelector("input").onchange=e=>toggle(id,e.target.checked);
    row.querySelector(".t").onclick=()=>{
      if(openIt.has(id)){ openIt.delete(id); if(selItem===id) selItem=null; } else { openIt.add(id); selItem=id; }
      drawDetail(); drawDots();
      const dp=dotPos(byId[id]); if(dp&&selItem===id) focusPts(dp.pts);
    };
    const pb=row.querySelector('[data-a="pin"]'); if(pb) pb.onclick=()=>startPlacing(id);
    const ub=row.querySelector('[data-a="unpin"]'); if(ub) ub.onclick=()=>{ delete ipos[id]; saveI(); drawDetail(); drawDots(); };
  });
}

// ---------- journey strip ----------
function drawJourney(){
  const nav=$("journey"); nav.innerHTML="";
  ORDERED.forEach(r=>{
    const c=counts(regionItems(r)), pct=c.t?Math.round(c.d/c.t*100):0;
    const d=document.createElement("div");
    d.className="jc"+(selR===r?" sel":"")+(pct===100?" full":"");
    d.style.borderLeft="4px solid "+hueOf(r);
    d.innerHTML=`${r.n}. ${esc(SHORT[r.id]||r.name)}<small>Lv ${esc(r.lvl)} · ${c.d}/${c.t}</small><div class="jb"><i style="width:${pct}%"></i></div>`;
    d.onclick=()=>select(r);
    nav.appendChild(d);
  });
}
function drawOverall(){
  const c=counts(ALL), pct=c.t?Math.round(c.d/c.t*100):0;
  $("obar").style.width=pct+"%"; $("otext").textContent=`${c.d}/${c.t} found · ${pct}%`;
}
function toggle(id,on){ if(on) done[id]=true; else delete done[id]; saveDone(); drawAll(); }

// ---------- controls ----------
$("search").addEventListener("input",e=>{ search=e.target.value.trim().toLowerCase(); drawAll(); });
$("mv").onclick=e=>{ moving=!moving; e.currentTarget.classList.toggle("on",moving); vp.classList.toggle("moving",moving); };
$("reset").onclick=()=>{ if(confirm("Reset all found items? (pins are kept)")){ done={}; saveDone(); drawAll(); } };
$("exp").onclick=()=>{
  const s=JSON.stringify({v:3,done,ipos,bpos});
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(()=>alert("Progress copied to clipboard."),()=>prompt("Copy:",s)); else prompt("Copy:",s);
};
$("imp").onclick=()=>{
  const s=prompt("Paste exported progress:"); if(!s) return;
  try{
    const o=JSON.parse(s);
    if(o&&o.v===3){ done=o.done||{}; ipos=o.ipos||{}; bpos=o.bpos||{}; } else if(o&&o.v===2){ done=o.done||{}; } else if(o&&typeof o==="object"){ done=o; }
    saveDone(); saveI(); saveB(); drawAll();
  }catch(e){ alert("Invalid data."); }
};
vp.addEventListener("dblclick",e=>{ if(e.target.closest(".bd,.dot")) return; const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,1.8,true); });

const img=$("mapimg");
const imgState=ok=>{ $("nomap").style.display=ok?"none":"grid"; };
img.onload=()=>{ imgState(true); fit(); };
img.onerror=()=>imgState(false);

function drawAll(){ drawBadges(); drawZones(); drawDots(); drawDetail(); drawJourney(); drawOverall(); }
fit(); drawAll();
if(img.complete) imgState(img.naturalWidth>0);
</script>
</body>
</html>
