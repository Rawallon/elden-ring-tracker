<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elden Ring Map Tracker</title>
<style>
  :root{
    --bg:#0c0a07; --panel:#17130d; --panel2:#211a11; --line:#3a2f1e;
    --text:#e8dcc0; --muted:#9a8c6e; --gold:#d4a84b; --boss:#c9503c; --quest:#d4a84b; --item:#5b9bd5; --ok:#6fae5f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Georgia,"Times New Roman",serif;display:flex;overflow:hidden}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:5px 10px;border-radius:5px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}
  input[type=search]{width:100%;background:#0c0a07;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 9px;font:inherit}

  /* sidebar */
  #side{width:370px;max-width:44vw;height:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);flex:none}
  .sh{padding:12px 14px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 8px;font-size:17px;letter-spacing:.07em;color:var(--gold)}
  .bar{height:9px;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a22,var(--gold));transition:width .3s}
  #otext{color:var(--muted);font-size:12.5px}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  #list{overflow:auto;flex:1;padding-bottom:30px}
  details{border-bottom:1px solid var(--line)}
  summary{cursor:pointer;padding:8px 14px;display:flex;justify-content:space-between;gap:8px;list-style:none;background:#1c160e}
  summary::-webkit-details-marker{display:none}
  summary b{color:var(--gold);font-weight:600}
  summary small{color:var(--muted)}
  .it{display:flex;gap:9px;align-items:flex-start;padding:6px 14px;border-top:1px solid #2a2216}
  .it:hover{background:#1f1810}
  .it input{margin-top:3px;accent-color:var(--ok);width:15px;height:15px;flex:none}
  .it .t{flex:1;cursor:pointer}
  .it.done .t{color:var(--muted);text-decoration:line-through}
  .gl{display:inline-block;width:16px;text-align:center;margin-right:3px}
  .gl.boss{color:var(--boss)} .gl.quest{color:var(--quest)} .gl.item{color:var(--item)}
  .nopin{color:var(--muted);font-size:11px}

  /* map */
  #main{flex:1;position:relative;min-width:0;height:100%}
  #vp{position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;cursor:grab}
  #vp.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:1920px;height:1750px;transform-origin:0 0;overflow:hidden}
  #world.anim{transition:transform .4s ease}
  #world img{position:absolute;left:0;top:0;width:1920px;height:1851px;display:block;user-select:none;-webkit-user-drag:none}
  .mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;
      font-size:13px;line-height:1;color:#fff;cursor:pointer;box-shadow:0 1px 5px #000b;transform:scale(var(--inv,1));transform-origin:center;user-select:none;touch-action:none}
  .mk.boss{background:var(--boss)} .mk.quest{background:#a8802f} .mk.item{background:#3f77ab}
  .mk.found{background:#3f6a35;opacity:.55;border-color:#9ad08a}
  .mk.sel{box-shadow:0 0 0 4px var(--gold),0 1px 6px #000}
  .editing .mk{outline:2px dashed var(--gold);outline-offset:2px;cursor:move}
  .zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoom button{width:34px;height:34px;padding:0;font-size:18px;background:#17130dcc}
  #offmap{position:absolute;left:12px;bottom:12px;right:60px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:5;background:#17130dcc;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
  #offmap span{color:var(--muted)}
  #nomap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);z-index:4;background:#0c0a07}

  /* popup */
  #pop{position:absolute;z-index:10;width:310px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;box-shadow:0 8px 24px #000c;display:none}
  #pop h3{margin:0 0 2px;font-size:15px;color:var(--gold);padding-right:20px}
  #pop .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
  #pop .where{font-size:13px;color:#cfc3a4;max-height:180px;overflow:auto}
  #pop .where b{color:var(--gold)}
  #pop .where em,#pop .note{color:var(--muted);font-size:12.5px}
  #pop .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:var(--muted)}
  #pop label{display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer;font-weight:600}
  #pop input{accent-color:var(--ok);width:17px;height:17px}
  #pop a{color:var(--item);font-size:12px}
  .warn{background:#3a1a14;border:1px solid var(--boss);color:#f0c8bf;padding:6px 9px;border-radius:6px;margin:6px 0;font-size:12.5px}

  @media(max-width:800px){
    body{flex-direction:column-reverse;overflow:auto}
    #side{width:100%;max-width:none;height:auto;min-height:50vh}
    #main{height:55vh;flex:none}
    #list{overflow:visible}
  }
</style>
</head>

 caelid:[53,72], dragonbarrow:[64,67]
};
const OFF = ["siofra","ainsel","deeproot","mohgwyn","dlc"];
const GL = {boss:"☠", quest:"!", item:"◆"};
const LS = (k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } };

let done = {}, pos = {};
try { done = JSON.parse(LS("er-progress-v1")||"{}"); } catch(e){}
try { pos  = JSON.parse(LS("er-ipos-v1")||"{}"); } catch(e){}
const saveDone = ()=>LS("er-progress-v1", JSON.stringify(done));
const savePos  = ()=>LS("er-ipos-v1", JSON.stringify(pos));
const idOf = (r,i)=> r.id + ":" + i;

// flatten
const ALL = [];
R.forEach(r=>r.items.forEach((it,i)=>ALL.push({id:idOf(r,i), r, it, i})));
const byId = Object.fromEntries(ALL.map(o=>[o.id,o]));

// default positions: ring around the region pin
(function(){
  R.forEach(r=>{
    if (!PIN0[r.id]) return;
    const n = r.items.length, rx = Math.min(4, 1.2 + 0.4*n), ry = rx*MAPW/IMGH;
    r.items.forEach((it,i)=>{
      const a = (i/n)*Math.PI*2 - Math.PI/2;
      byId[idOf(r,i)].def = [PIN0[r.id][0] + Math.cos(a)*rx, PIN0[r.id][1] + Math.sin(a)*ry];
    });
  });
})();
const posOf = o => pos[o.id] || o.def || null;

// state
const types = {boss:true, quest:true, item:true};
let hideFound = false, editing = false, search = "", selId = null;
const openR = new Set(["limgrave"]);

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function whereParts(it){
  const raw = W[it.x]; if (!raw) return {txt:"", unv:false};
  const p = raw.split("|"); return {txt:p[0], unv:p[1]==="u"};
}
function visible(o){
  if (!types[o.it.t]) return false;
  if (hideFound && done[o.id]) return false;
  if (search){
    const hay = (o.it.x+" "+(o.it.n||"")+" "+whereParts(o.it).txt+" "+o.r.name).toLowerCase();
    if (!hay.includes(search)) return false;
  }
  return true;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function counts(list){ const d=list.filter(o=>done[o.id]).length; return {d,t:list.length}; }

// ---------- pan / zoom ----------
const vp = $("vp"), world = $("world");
let S=1, TX=0, TY=0, fitS=1;
function apply(anim){
  world.classList.toggle("anim", !!anim);
  world.style.transform = `translate(${TX}px,${TY}px) scale(${S})`;
  world.style.setProperty("--inv", (1/S).toFixed(4));
}
function fit(anim){
  const w = vp.clientWidth, h = vp.clientHeight;
  fitS = Math.min(w/MAPW, h/MAPH);
  S = fitS; TX = (w-MAPW*S)/2; TY = (h-MAPH*S)/2; apply(anim);
}
function zoomAt(cx, cy, f, anim){
  const s2 = Math.max(fitS*0.9, Math.min(5, S*f));
  TX = cx - (cx-TX)*s2/S; TY = cy - (cy-TY)*s2/S; S = s2; apply(anim);
}
vp.addEventListener("wheel", e=>{
  e.preventDefault(); closePop();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.0015));
},{passive:false});
$("zin").onclick  = ()=>zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.4, true);
$("zout").onclick = ()=>zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.4, true);
$("zfit").onclick = ()=>fit(true);
window.addEventListener("resize", ()=>{ const was = S<=fitS*1.001; const old=fitS; fitS = Math.min(vp.clientWidth/MAPW, vp.clientHeight/MAPH); if(was) fit(); });

const ptrs = new Map(); let lastDist = 0, moved = 0, dragMarker = null;
vp.addEventListener("pointerdown", e=>{
  const mk = e.target.closest(".mk");
  moved = 0;
  if (mk && editing){
    dragMarker = mk; mk.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastDist = Math.hypot(a.x-b.x,a.y-b.y); }
});
vp.addEventListener("pointermove", e=>{
  if (dragMarker){
    const r = vp.getBoundingClientRect();
    const wx = (e.clientX-r.left-TX)/S, wy = (e.clientY-r.top-TY)/S;
    const x = Math.max(0,Math.min(100, wx/MAPW*100)), y = Math.max(0,Math.min(100, wy/IMGH*100));
    pos[dragMarker.dataset.id] = [+x.toFixed(2), +y.toFixed(2)];
    dragMarker.style.left = (x/100*MAPW)+"px"; dragMarker.style.top = (y/100*IMGH)+"px";
    moved = 99; return;
  }
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size===1){
    moved += Math.abs(dx)+Math.abs(dy);
    if (moved>4){ if(!vp.classList.contains("drag")) try{ vp.setPointerCapture(e.pointerId); }catch(_){} vp.classList.add("drag"); closePop(); TX += dx; TY += dy; apply(); }
  } else if (ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y);
    const r = vp.getBoundingClientRect();
    if (lastDist) zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top, d/lastDist);
    lastDist = d; moved = 99; closePop();
  }
});
function endPtr(e){
  if (dragMarker){ dragMarker = null; savePos(); return; }
  ptrs.delete(e.pointerId); lastDist = 0; vp.classList.remove("drag");
}
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);

// ---------- markers ----------
function drawMarkers(){
  const layer = $("mk"); layer.innerHTML = "";
  ALL.forEach(o=>{
    if (!visible(o)) return;
    const p = posOf(o); if (!p) return;
    const el = document.createElement("div");
    el.className = "mk "+o.it.t+(done[o.id]?" found":"")+(o.id===selId?" sel":"");
    el.dataset.id = o.id;
    el.textContent = done[o.id] ? "✓" : GL[o.it.t];
    el.style.left = (p[0]/100*MAPW)+"px"; el.style.top = (p[1]/100*IMGH)+"px";
    el.addEventListener("click", ev=>{ if (moved>4) return; ev.stopPropagation(); selId = o.id; drawMarkers(); showPop(o, el); });
    layer.appendChild(el);
  });
}

// ---------- popup ----------
const pop = $("pop");
function closePop(){ pop.style.display = "none"; }
function warnFor(r){
  return (r.id==="mountaintops"||r.id==="farum")
    ? `<div class="warn">Before the Forge of the Giants / Maliketh: finish Ranni, Millicent, Varre, Volcano Manor, Fia, Goldmask, Sellen quests.</div>` : "";
}
function showPop(o, anchor){
  const w = whereParts(o.it);
  const lnk = `<a href="${q(o.it.x)}" target="_blank" rel="noopener">search the web</a>`;
  pop.innerHTML = `<button class="x" aria-label="Close">&times;</button>
    <h3>${esc(o.it.x)}</h3>
    <div class="meta">${o.it.t.toUpperCase()} · ${esc(o.r.name)} · Lv ${esc(o.r.lvl)}</div>
    ${o.it.n?`<div class="note">${esc(o.it.n)}</div>`:""}
    <div class="where">${w.txt?`<b>Where:</b> ${esc(w.txt)}${w.unv?" <em>(not wiki-checked)</em>":""}`:`<em>Location text not added yet.</em>`} ${lnk}</div>
    ${warnFor(o.r)}
    <label><input type="checkbox" ${done[o.id]?"checked":""}> Mark as found</label>`;
  pop.style.display = "block";
  pop.querySelector(".x").onclick = closePop;
  pop.querySelector("input").onchange = e=>{ toggle(o.id, e.target.checked); };
  // place near anchor
  const vr = $("main").getBoundingClientRect();
  let left, top;
  if (anchor){
    const ar = anchor.getBoundingClientRect();
    left = ar.right - vr.left + 12; top = ar.top - vr.top - 10;
  } else { left = 20; top = 20; }
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  if (left + pw > vr.width - 8) left = Math.max(8, (anchor ? anchor.getBoundingClientRect().left - vr.left - pw - 12 : vr.width-pw-8));
  top = Math.max(8, Math.min(top, vr.height - ph - 8));
  pop.style.left = left+"px"; pop.style.top = top+"px";
}

function focusItem(o){
  const p = posOf(o);
  selId = o.id;
  if (!p){ drawMarkers(); showPop(o, null); return; }
  const ts = Math.max(S, fitS*2.2);
  S = Math.min(ts, 5);
  TX = vp.clientWidth/2 - (p[0]/100*MAPW)*S; TY = vp.clientHeight/2 - (p[1]/100*IMGH)*S;
  apply(true); drawMarkers();
  setTimeout(()=>{ const el = document.querySelector(`.mk[data-id="${CSS.escape(o.id)}"]`); showPop(o, el||null); }, 420);
}

// ---------- state change ----------
function toggle(id, on){
  if (on) done[id] = true; else delete done[id];
  saveDone(); drawMarkers(); drawList(); drawOverall(); drawOff();
  const o = byId[id]; if (pop.style.display==="block" && o){ const el=document.querySelector(`.mk[data-id="${CSS.escape(id)}"]`); showPop(o, el||null); }
}

// ---------- sidebar ----------
function drawCats(){
  const box = $("cats"); box.innerHTML = "";
  ["boss","quest","item"].forEach(t=>{
    const c = counts(ALL.filter(o=>o.it.t===t));
    const b = document.createElement("button");
    b.className = "chip"+(types[t]?" on":"");
    b.innerHTML = `<span class="gl ${t}">${GL[t]}</span>${t} ${c.d}/${c.t}`;
    b.onclick = ()=>{ types[t]=!types[t]; drawCats(); drawList(); drawMarkers(); };
    box.appendChild(b);
  });
}
function drawList(){
  const box = $("list"); const keepScroll = box.scrollTop; box.innerHTML = "";
  R.slice().sort((a,b)=>a.n-b.n).forEach(r=>{
    const all = ALL.filter(o=>o.r===r), vis = all.filter(visible);
    if (!vis.length && (search || hideFound)) return;
    const c = counts(all);
    const d = document.createElement("details");
    d.id = "reg-"+r.id; d.open = openR.has(r.id) || !!search;
    d.addEventListener("toggle", ()=>{ if(d.open) openR.add(r.id); else openR.delete(r.id); });
    d.innerHTML = `<summary><span><b>${r.n}. ${esc(r.name)}</b> <small>Lv ${esc(r.lvl)}</small></span><small>${c.d}/${c.t}</small></summary>`;
    vis.forEach(o=>{
      const row = document.createElement("div");
      row.className = "it"+(done[o.id]?" done":"");
      row.innerHTML = `<input type="checkbox" ${done[o.id]?"checked":""}><span class="t"><span class="gl ${o.it.t}">${GL[o.it.t]}</span>${esc(o.it.x)}${posOf(o)?"":' <span class="nopin">(off-map)</span>'}</span>`;
      row.querySelector("input").onchange = e=>toggle(o.id, e.target.checked);
      row.querySelector(".t").onclick = ()=>focusItem(o);
      d.appendChild(row);
    });
    box.appendChild(d);
  });
  box.scrollTop = keepScroll;
}
function drawOverall(){
  const c = counts(ALL), pct = c.t ? Math.round(c.d/c.t*100) : 0;
  $("obar").style.width = pct+"%";
  $("otext").textContent = `${c.d}/${c.t} found · ${pct}%`;
  drawCats();
}
function drawOff(){
  const box = $("offmap"); box.innerHTML = "<span>Underground / DLC (no pin on this map):</span>";
  OFF.forEach(id=>{
    const r = R.find(x=>x.id===id); if(!r) return;
    const c = counts(ALL.filter(o=>o.r===r));
    const b = document.createElement("button");
    b.textContent = `${r.name.replace(/ \(.*\)/,"")} ${c.d}/${c.t}`;
    b.onclick = ()=>{ openR.add(r.id); drawList(); const el=$("reg-"+r.id); if(el) el.scrollIntoView({block:"start"}); };
    box.appendChild(b);
  });
}

// ---------- controls ----------
$("q").addEventListener("input", e=>{ search = e.target.value.trim().toLowerCase(); drawList(); drawMarkers(); });
$("hideFound").onclick = e=>{ hideFound=!hideFound; e.currentTarget.classList.toggle("on",hideFound); drawList(); drawMarkers(); };
$("edit").onclick = e=>{ editing=!editing; e.currentTarget.classList.toggle("on",editing); vp.classList.toggle("editing",editing); closePop(); };
$("openAll").onclick = e=>{
  const open = e.currentTarget.dataset.open!=="1";
  e.currentTarget.dataset.open = open?"1":"0"; e.currentTarget.textContent = open?"Collapse all":"Expand all";
  R.forEach(r=>{ if(open) openR.add(r.id); else openR.delete(r.id); }); drawList();
};
$("reset").onclick = ()=>{ if(confirm("Reset all found items? (marker positions are kept)")){ done={}; saveDone(); drawAll(); } };
$("exp").onclick = ()=>{
  const s = JSON.stringify({v:2, done, pos});
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(()=>alert("Progress copied to clipboard."),()=>prompt("Copy:",s)); else prompt("Copy:",s);
};
$("imp").onclick = ()=>{
  const s = prompt("Paste exported progress:"); if(!s) return;
  try{
    const o = JSON.parse(s);
    if (o && o.v===2){ done = o.done||{}; pos = o.pos||{}; } else if (o && typeof o==="object"){ done = o; }
    saveDone(); savePos(); drawAll();
  }catch(e){ alert("Invalid data."); }
};
vp.addEventListener("click", e=>{ if (!e.target.closest(".mk") && moved<=4) closePop(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closePop(); });

const img = $("mapimg");
const imgState = ok=>{ $("nomap").style.display = ok?"none":"flex"; };
img.onload = ()=>{ imgState(true); fit(); };
img.onerror = ()=>imgState(false);

function drawAll(){ drawMarkers(); drawList(); drawOverall(); drawOff(); }
fit(); drawAll();
if (img.complete) imgState(img.naturalWidth>0);
</script>
</body>
</html>
