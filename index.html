te because the enemies are far above this level. The key beats there are the Baleful Shadow's Discarded Palace Key and the Lake of Rot, where Astel waits."]], "siofra": [["Light the eight pillars", "Siofra River is entered by a lift from the Siofra River Well. Lighting the eight pillars near the stairs to the Hallowhorn Grounds opens the path to the Ancestor Spirit's arena."], ["Defeat the Mimic Tear", "Nokron is the sunken city that only opens once Radahn is beaten. The Mimic Tear is a boss that copies you; it sits behind a mist door."], ["Open the imp-statue chest", "The Mimic Tear Ashes are in a chest in Night's Sacred Ground behind an imp statue door that needs a Stonesword Key. They summon a copy of you and are one of the best spirit ashes in the game."], ["Defeat the Regal", "The Regal Ancestor Spirit is in an arena reached from Nokron. It is the second Ancestor Spirit boss in the underground and is optional if you want to move faster."], ["Beat the Valiant Gargoyles", "The Valiant Gargoyles are in Siofra Aqueduct. The coffin after them is the way into Deeproot Depths, where Fia's questline and Fortissax are."]], "caelid": [["Smoldering Church", "Caelid is a dangerous, rot-filled region that sits next to Limgrave. The sites here are Smoldering Church, Fort Gael, Sellia and the War-Dead Catacombs, which give resources and the Golden Scarab. It is the main way to reach Radahn."], ["Bring immunity gear", "Scarlet Rot is a status that drains health fast and the Abandoned Cave has rot pools. Preserving Boluses and immunity gear let you pass without dying to it."], ["Follow Millicent", "Millicent's quest is one of the longest in the game and crosses Caelid, Altus, the Mountaintops and the Haligtree. It begins with Gowry and the Unalloyed Gold Needle and ends with a choice that changes your rewards, so starting it now keeps you on track."], ["Talk to Alexander", "Alexander and Blaidd both fight beside you against Radahn. Talking to them first sets up that help and moves their questlines along. If the Old Geezer loops, talk to Iji at Caria Manor first."], ["Deathroot", "Gurranq the Beast Clergyman at the Bestial Sanctum gives rewards for Deathroot, which you collect by killing Those Who Live in Death. The Deathroot questline began at Summonwater Village, and the sanctum itself is dangerous this early."], ["Bernahl", "Knight Bernahl lives at the Warmaster's Shack in Stormhill and his quest only truly begins once you pledge to Volcano Manor. He later joins the manor as Recusant Bernahl."]], "deeproot": [["Enter through the coffin", "Deeproot Depths is a sealed-off underground area. The only legitimate way in is the coffin after the Valiant Gargoyle in Siofra Aqueduct."], ["Advance Fia", "Fia, the Deathbed Companion, is a quest character at the Prince of Death's Throne. She needs the Cursemark of Death from the Divine Tower of Liurnia, and her questline feeds directly into one of the endings."], ["Fia's Champions", "Fia's Champions is an optional boss fight. Beating it opens the Prince of Death's Throne grace, but the quest itself can progress without more fighting."], ["Defeat Lichdragon", "Lichdragon Fortissax is the Deeproot Depths boss. It is optional and sits at the end of the area."]], "altus": [["Enter Altus", "Altus Plateau is reached either by the Grand Lift of Dectus (with both medallion halves) or by Ruin-Strewn Precipice. This is the golden-lit region between you and Leyndell."], ["Do the west and east", "Altus has many small sites: Old Altus Tunnel, the Shaded Castle, the Golden Lineage Evergaol and the Second Church of Marika. They give upgrade materials and are where the Mt. Gelmir grace gets unlocked."], ["Meet Boc, Corhyn", "Corhyn and Goldmask are an NPC pair whose questline spans Altus, Leyndell, the Mountaintops and the Ashen Capital. It must be advanced before the Erdtree burns or Corhyn disappears and Goldmask never appears."], ["Capital Outskirts", "The Draconic Tree Sentinel guards the road into Leyndell from the Capital Outskirts, the last stop before the capital."]], "gelmir": [["Fort Laiedd", "Mt. Gelmir is a volcanic area with Fort Laiedd, Gelmir Hero's Grave and a Magma Wyrm. It is the way into Volcano Manor."], ["Join Volcano Manor", "Volcano Manor is the assassin's guild-style questline run by Tanith. You join it, take contracts and eventually fight Rykard."], ["Finish every contract", "Each contract (Istvan, Rileigh, Juno Hoslow) unlocks other NPCs' quests. If you kill Rykard first, those rewards are locked until NG+."], ["Bernahl's side", "Bernahl moves into Volcano Manor and his quest completes alongside the contracts. It links to the Fortified Manor summons."], ["Defeat Rykard", "Rykard is a Shardbearer whose Great Rune also counts toward Leyndell. Only kill him after finishing every Volcano Manor questline."]], "dragonbarrow": [["Loot the right Dectus", "Fort Faroth holds the right half of the Dectus Medallion; with the left half from Fort Haight it powers the Grand Lift of Dectus."], ["Greyoll", "Dragonbarrow is an optional, high-level area. The route recommends level 80 and above, and its loot is a bonus rather than a requirement."]], "leyndell": [["Skip the Tree Sentinel duo", "The Capital Outskirts is the approach to Leyndell. The route lets you run past the Tree Sentinel duo to the Outer Wall Phantom Tree grace, and the Sealed Tunnel is behind an illusory wall."], ["Have two Great Runes", "Enia the Finger Reader at Roundtable Hold checks that you have at least two Great Runes before Leyndell will let you in. Any two from the seven will do."], ["Defeat Godfrey", "Godfrey's golden shade is the first major fight inside Leyndell, near the West Capital Rampart."], ["Defeat Morgott", "Morgott is the Omen King and a Shardbearer. Beating him gives his Great Rune and, after you fail to enter the Erdtree, Melina gives you the Rold Medallion."], ["Grab the capital loot", "Parts of Royal Capital are lost once Maliketh falls and the city turns ashen: the Bolt of Gransax, the Golden Order Principia, the Erdtree Bow and the Celestial Dew. Collect them first."], ["Pick up the Seedbed Curses", "Seedbed Curses are items used for the Dung Eater questline. They are found in specific spots in the capital that are lost later."], ["Solve the Goldmask", "The Goldmask riddle must be solved in Leyndell before the Erdtree burns, otherwise Corhyn vanishes and Goldmask never returns."], ["Nepheli's quest", "Nepheli's questline has its final step in the Stormveil throne room, and it only triggers after Morgott. Several earlier steps must happen in order."], ["Boc has a choice", "Giving Boc the Larval Tear sends him to the Academy; the other option keeps him in the room. It is a permanent choice."], ["Gideon is fought later", "Sir Gideon Ofnir is the All-Knowing; he is fought in the Ashen Capital after Farum Azula, not here."]], "mountaintops": [["Melina gives the Rold", "After you fail to enter the Erdtree, Melina gives you the Rold Medallion. Using it at the Grand Lift of Rold carries you up to the Mountaintops of the Giants."], ["Night's Cavalry", "The Forbidden Lands are the first area past Leyndell. Night's Cavalry only appears at night and there is a Golden Seed and Black Blade Kindred here."], ["Zamor Ruins", "These Mountaintops sites give upgrade materials and are the stepping stones to Castle Sol and the Fire Giant."], ["Defeat Commander Niall", "Commander Niall guards Castle Sol. The tower roof behind him holds the left Haligtree Secret Medallion half."], ["Defeat the Fire Giant", "The Fire Giant stands between you and the Forge of the Giants. Beating him opens the final stretch toward the forge."], ["Volcano Manor line", "Juno Hoslow at Shack of the Lofty is the last Volcano Manor contract, and Tanith should be revisited after."], ["Three Fingers", "The Three Fingers are the entities behind the Frenzied Flame ending. They are in the sewers under Leyndell, and touching them locks you into that ending."], ["The Forge of the Giants", "The Forge is where Melina asks if you will commit the sin of burning the Erdtree. Accepting teleports you to Crumbling Farum Azula. It is the point of no return for many NPC quests, so finish them first."]], "snowfield": [["Take the left Secret", "The Haligtree Secret Medallion has two halves: the left is on the Castle Sol roof and the right is in the Village of the Albinaurics in Liurnia. Both are needed to open the Snowfield."], ["Hoist the Secret Medallion", "At the Grand Lift of Rold you stand at the bottom and switch the action to Hoist Secret Medallion. It does not work from the top."], ["Catacombs and caves", "The Snowfield has catacombs and caves and is where Latenna's quest ends at Apostate Derelict."], ["Skip Ordina", "Ordina, Liturgical Town opens the path to a very hard late dungeon, which the route says to avoid for now."], ["Millicent continues", "Millicent's quest continues into Elphael, at the Prayer Room, past the Putrid Tree Spirit."]], "mohgwyn": [["Varre's questline", "White Mask Varré is the invader who gives you the Pureblood Knight's Medal after three invasions. The medal teleports you to Mohgwyn but the area is dangerous early."], ["Map, key items", "Mohgwyn Palace is an underground area with a Mausoleum and caves, and it is rich in upgrade materials."], ["Defeat Mohg", "Mohg is a Shardbearer whose Great Rune counts toward Leyndell and whose defeat is required for the Shadow of the Erdtree DLC."]], "haligtree": [["Canopy, Haligtree Town", "Miquella's Haligtree is a late, very hard area. The canopy and town lead down to Elphael."], ["Defeat Loretta", "Loretta, Knight of the Haligtree is a boss at the end of the town and an obstacle toward Elphael."], ["Millicent's finale", "Millicent's finale asks whether you help her or betray her; the choice changes your rewards."], ["Defeat Malenia", "Malenia, Blade of Miquella is a Shardbearer and one of the hardest bosses. Her Great Rune and Gideon's Roundtable rewards depend on her."], ["Claim Gideon", "Gideon's rewards require that you discovered Mohgwyn and the Haligtree and defeated Mohg and Malenia. If you miss them, the Twin Maiden Husks sell them."]], "farum": [["Dragon Temple", "Crumbling Farum Azula is a sky-high ruin. The Forge of the Giants teleports you here."], ["Defeat the Godskin Duo", "The Godskin Duo is the boss in the temple, and the Dragon Temple Transept grace is next to it."], ["Optional: Dragonlord", "Dragonlord Placidusax is an optional ancient dragon. The Miquella's Needle can remove the Frenzied Flame here."], ["Finish all Royal Capital", "Maliketh's fight is the point of no return. Finish Leyndell NPC quests and collect items before you start it."], ["Defeat Maliketh", "Killing Maliketh ashens Leyndell and blocks several areas and quests until NG+."]], "ashen": [["Finish the Corhyn", "Corhyn and Goldmask's questline concludes in the Ashen Capital."], ["Beat Hoarah Loux", "Godfrey as Hoarah Loux, Warrior is the next boss in the Elden Throne after Gideon."], ["Beat Radagon", "Radagon of the Golden Order follows Hoarah Loux through the luminous barrier."], ["Beat the Elden Beast", "The Elden Beast follows Radagon at the Elden Throne and is mandatory."], ["Pick an ending", "You pick your ending after the Elden Beast. The default Age of Fracture needs no questlines; others need specific NPC quests done."], ["Defeat Esgar", "Esgar, Priest of Blood is a boss in the Subterranean Shunning-Grounds, the sewers under Leyndell."], ["Defeat Mohg, the Omen", "Mohg, the Omen is a boss in the Shunning-Grounds, separate from Mohg, Lord of Blood."], ["Finish Hyetta", "Hyetta's quest finishes in the Shunning-Grounds."]], "dlc": [["Beat Radahn and Mohg", "The DLC is unlocked by defeating Radahn and Mohg and entering Miquella's cocoon at Mohgwyn Palace."], ["Gather Scadutree", "Scadutree Fragments raise your damage and defense in the Realm of Shadow. There are 50 across the DLC."], ["Gather Revered", "Revered Spirit Ash boosts spirit ashes and Torrent in the DLC."], ["Belurat", "Belurat, Tower Settlement ends with the Divine Beast Dancing Lion."], ["Castle Ensis", "Castle Ensis East Wing ends with Rellana."], ["Shadow Keep", "Messmer waits in the Specimen Storehouse of the Shadow Keep."], ["Enir-Ilim", "Enir-Ilim is the final area and ends with Promised Consort Radahn."]]};
let tab = (function(){ try{ return localStorage.getItem('er-tab')||'list'; }catch(e){ return 'list'; } })();
function drawGuide(r){
  const steps=GUIDE[r.id]||[];
  const warn=(r.id==="mountaintops"||r.id==="farum")?`<div class="warn">Before the Forge of the Giants / Maliketh: finish Ranni, Millicent, Varre, Volcano Manor, Fia, Goldmask and Sellen quests.</div>`:"";
  let html=warn;
  steps.forEach((st,i)=>{
    if(typeof st==="string"){ html+=`<div class="gh">${esc(st.replace(/^# /,""))}</div>`; return; }
    const text=st[0], key=st[1];
    const o=key?ALL.find(x=>x.r===r&&x.it.x===key):null;
    const id=o?o.id:"gs:"+r.id+":"+i, dn=!!done[id];
    const wr=st[2]||((WHY[r.id]||[]).find(w=>text.startsWith(w[0]))||[])[1]; const why=wr?`<span class="gw"><b>Context:</b> ${esc(wr)}</span>`:"";
    html+=`<div class="gstep${dn?" done":""}${o?" linked":""}${o&&selItem===o.id?" hl":""}" data-id="${esc(id)}" data-o="${o?esc(o.id):""}"><input type="checkbox" ${dn?"checked":""}><span class="gt">${o?`<span class="gl ${o.it.t}">${GL[o.it.t]}</span> `:""}${esc(text)}${why}</span></div>`;
  });
  html+=`<div class="it"><span class="note">Based on the Fextralife Game Progress Route (credit: Fextralife wiki), summarised in my own words. Steps with an icon are tied to the checklist and tick together; plain steps are guide-only.</span><div class="act" style="margin-top:8px"><a href="https://eldenring.wiki.fextralife.com/Game_Progress_Route" target="_blank" rel="noopener" style="color:var(--item);font-size:12.5px">Open the full wiki route for the original text ↗</a></div></div>`;
  $("di").innerHTML=html;
  $("di").querySelectorAll(".gstep").forEach(row=>{
    const id=row.dataset.id, oid=row.dataset.o;
    row.querySelector("input").onchange=e=>toggle(id,e.target.checked);
    if(oid) row.querySelector(".gt").onclick=()=>{ selItem=oid; drawDots(); drawDetail(); const dp=dotPos(byId[oid]); if(dp) focusPts(dp.pts); };
  });
}
function setTab(t){ tab=t; try{localStorage.setItem('er-tab',t);}catch(e){} drawDetail(); }
// ---------- detail panel ----------
function select(r, zoom=true){
  if (selR!==r) selItem=null;
  selR=r; $("detail").classList.add("open");
  drawBadges(); drawZones(); drawDetail(); drawJourney(); drawDots();
  if (zoom){ const p=bposOf(r); if(p) setTimeout(()=>centerOn(p[0],p[1],Math.max(fitS*2.2,S<fitS*2.2?fitS*2.2:S)),50); }
}
function closeDetail(){ selR=null; selItem=null; $("detail").classList.remove("open"); drawBadges(); drawZones(); drawJourney(); drawDots(); }
$("dx").onclick=closeDetail;

function drawDetail(){
  if(!selR) return;
  const r=selR, all=regionItems(r), c=counts(all), pct=c.t?Math.round(c.d/c.t*100):0;
  $("dt").textContent=r.name;
  $("ds").textContent=`Step ${r.n} · recommended level ${r.lvl} · ${c.d}/${c.t} found`;
  $("db").style.width=pct+"%";
  const rnEl=$("rn"); if(RN[r.id]){ rnEl.style.display=""; rnEl.querySelector("div").textContent=RN[r.id]; } else { rnEl.style.display="none"; }
  $("fl").innerHTML=["all","boss","quest","item"].map(t=>`<button data-f="${t}" class="${filterT===t?"on":""}">${t==="all"?"all":GL[t]+" "+t}</button>`).join("");
  $("fl").querySelectorAll("button").forEach(b=>b.onclick=()=>{ filterT=b.dataset.f; drawDetail(); drawDots(); });
  document.querySelectorAll("#tabs button").forEach(bt=>{ bt.classList.toggle("on",bt.dataset.t===tab); bt.onclick=()=>setTab(bt.dataset.t); });
  if (tab==="guide"){ $("fl").style.display="none"; drawGuide(r); return; }
  $("fl").style.display="";
  const warn=(r.id==="mountaintops"||r.id==="farum")?`<div class="warn">Before the Forge of the Giants / Maliketh: finish Ranni, Millicent, Varre, Volcano Manor, Fia, Goldmask and Sellen quests.</div>`:"";
  const rows=all.filter(o=>(filterT==="all"||o.it.t===filterT)&&match(o)).map(o=>{
    const w=whereParts(o.it), open=openIt.has(o.id), pinned=!!ipos[o.id], dk=(dotPos(o)||{}).kind||"none";
    return `<div class="it${done[o.id]?" done":""}${selItem===o.id?" hl":""}" data-it="${esc(o.id)}">
      <div class="ih"><input type="checkbox" ${done[o.id]?"checked":""}><span class="t"><span class="gl ${o.it.t}">${GL[o.it.t]}</span>${esc(o.it.x)}${dk==="set"?' <span class="pinned">\u25CF pinned by you</span>':(dk==="data"?' <span class="pinned">\u25CF on map</span>':' <span class="pinned" style="color:var(--muted)">no map pin</span>')}</span></div>
      ${open?`<div class="ib">${o.it.n?`<div class="note">${esc(o.it.n)}</div>`:""}
        ${w.txt?`<div><b>Where:</b> ${esc(w.txt)}${w.unv?" <em>(not wiki-checked)</em>":""}</div>`:`<div><em>Location text not added yet.</em></div>`}
        <div class="act"><button data-a="pin">${pinned?"Re-pin on map":"Pin on map"}</button>${pinned?'<button data-a="unpin">Remove pin</button>':""}<a href="${q(o.it.x)}" target="_blank" rel="noopener">search</a></div></div>`:""}
    </div>`;
  }).join("");
  $("di").innerHTML=warn+(rows||`<div class="it"><em class="note">Nothing here for this filter.</em></div>`);
  $("di").querySelectorAll(".it[data-it]").forEach(row=>{
    const id=row.dataset.it, o=byId[id];
    row.querySelector("input").onchange=e=>toggle(id,e.target.checked);
    row.querySelector(".t").onclick=()=>{
      if(openIt.has(id)){ openIt.delete(id); if(selItem===id) selItem=null; } else { openIt.add(id); selItem=id; }
      drawDetail(); drawDots();
      const dp=dotPos(byId[id]); if(dp&&selItem===id) focusPts(dp.pts);
    };
    const pb=row.querySelector('[data-a="pin"]'); if(pb) pb.onclick=()=>startPlacing(id);
    const ub=row.querySelector('[data-a="unpin"]'); if(ub) ub.onclick=()=>{ delete ipos[id]; saveI(); drawDetail(); drawDots(); };
  });
}

// ---------- journey strip ----------
function drawJourney(){
  const nav=$("journey"); nav.innerHTML="";
  ORDERED.forEach(r=>{
    const c=counts(regionItems(r)), pct=c.t?Math.round(c.d/c.t*100):0;
    const d=document.createElement("div");
    d.className="jc"+(selR===r?" sel":"")+(pct===100?" full":"");
    d.style.borderLeft="4px solid "+hueOf(r);
    d.innerHTML=`${r.n}. ${esc(SHORT[r.id]||r.name)}<small>Lv ${esc(r.lvl)} · ${c.d}/${c.t}</small><div class="jb"><i style="width:${pct}%"></i></div>`;
    d.onclick=()=>select(r);
    nav.appendChild(d);
  });
}
function drawOverall(){
  const c=counts(ALL), pct=c.t?Math.round(c.d/c.t*100):0;
  $("obar").style.width=pct+"%"; $("otext").textContent=`${c.d}/${c.t} found · ${pct}%`;
}
function toggle(id,on){ if(on) done[id]=true; else delete done[id]; saveDone(); drawAll(); }

// ---------- controls ----------
$("search").addEventListener("input",e=>{ search=e.target.value.trim().toLowerCase(); drawAll(); });
$("mv").onclick=e=>{ moving=!moving; e.currentTarget.classList.toggle("on",moving); vp.classList.toggle("moving",moving); };
$("reset").onclick=()=>{ if(confirm("Reset all found items? (pins are kept)")){ done={}; saveDone(); drawAll(); } };
$("exp").onclick=()=>{
  const s=JSON.stringify({v:3,done,ipos,bpos});
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(()=>alert("Progress copied to clipboard."),()=>prompt("Copy:",s)); else prompt("Copy:",s);
};
$("imp").onclick=()=>{
  const s=prompt("Paste exported progress:"); if(!s) return;
  try{
    const o=JSON.parse(s);
    if(o&&o.v===3){ done=o.done||{}; ipos=o.ipos||{}; bpos=o.bpos||{}; } else if(o&&o.v===2){ done=o.done||{}; } else if(o&&typeof o==="object"){ done=o; }
    saveDone(); saveI(); saveB(); drawAll();
  }catch(e){ alert("Invalid data."); }
};
vp.addEventListener("dblclick",e=>{ if(e.target.closest(".bd,.dot")) return; const r=vp.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,1.8,true); });

const img=$("mapimg");
const imgState=ok=>{ $("nomap").style.display=ok?"none":"grid"; };
img.onload=()=>{ imgState(true); fit(); };
img.onerror=()=>imgState(false);

function drawAll(){ drawBadges(); drawZones(); drawDots(); drawDetail(); drawJourney(); drawOverall(); }
fit(); drawAll();
if(img.complete) imgState(img.naturalWidth>0);

(function(){
  const g=$("dgrip"), d=$("detail");
  try{ const w=parseInt(localStorage.getItem('er-dw')); if(w) d.style.setProperty('--dw',w+'px'); }catch(e){}
  g.addEventListener('pointerdown',e=>{
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('on'); d.style.transition='none';
    const mv=ev=>{ const w=Math.max(300,Math.min(innerWidth-80,innerWidth-ev.clientX)); d.style.setProperty('--dw',w+'px'); };
    const up=()=>{ g.classList.remove('on'); d.style.transition=''; g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up);
      try{ localStorage.setItem('er-dw',parseInt(getComputedStyle(d).width)); }catch(e){} };
    g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up);
  });
  g.addEventListener('dblclick',()=>{ d.style.removeProperty('--dw'); try{localStorage.removeItem('er-dw');}catch(e){} });
})();
</script>
</body>
</html>
